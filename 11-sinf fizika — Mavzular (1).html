><canvas id=\"xcCanvas\" width=\"800\" height=\"300\" aria-label=\"Sig‘im qarshiligining chastotaga bog‘liqligi\"><\/canvas><p class=\"mini\">Grafikda berilgan sig‘im uchun X꜀ chastota ortishi bilan kamayishi ko‘rsatiladi.<\/p><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"lab\">\n<h2>Virtual laboratoriya<\/h2>\n<p>Quyidagi tajribada berilgan boshlang‘ich qiymatlarni kiriting va natijalarni jadvalga qo‘shing. Hisoblashlar effektiv kuchlanish uchun bajariladi.<\/p>\n<div class=\"grid\">\n<div class=\"panel\"><label for=\"labC\">Sig‘im (μF)<\/label><input type=\"number\" id=\"labC\" min=\"1\" max=\"1000\" value=\"10\"><label for=\"labF\">Chastota (Hz)<\/label><input type=\"number\" id=\"labF\" min=\"1\" max=\"10000\" value=\"50\"><label for=\"labU\">Kuchlanish (V)<\/label><input type=\"number\" id=\"labU\" min=\"0.1\" max=\"1000\" value=\"10\"><button id=\"addRow\">Natijani jadvalga qo‘shish<\/button><button class=\"secondary\" id=\"clearRows\">Jadvalni tozalash<\/button><\/div>\n<div class=\"panel\"><h3>Hisoblash natijasi<\/h3><p id=\"labResult\" class=\"readout\">X꜀ = 318.31 Ω<\/p><p id=\"labCurrent\">I = 0.0314 A<\/p><p class=\"mini\">X꜀ = 1/(2πfC), I = U/X꜀. Sig‘im qiymati formulada faradga aylantiriladi.<\/p><\/div>\n<\/div>\n<table><thead><tr><th>№<\/th><th>Sig‘im (μF)<\/th><th>Chastota (Hz)<\/th><th>Kuchlanish (V)<\/th><th>X꜀ (Ω)<\/th><th>I (A)<\/th><\/tr><\/thead><tbody id=\"labRows\"><\/tbody><\/table>\n<\/section>\n\n<section class=\"card\" id=\"test\">\n<h2>Bilimni tekshirish testi<\/h2>\n<form id=\"quizForm\">\n<div class=\"quiz-q\"><b>1. Kondensatorning sig‘im birligi qaysi?<\/b><label><input type=\"radio\" name=\"q1\" value=\"a\"> Om<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Farad<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Amper<\/label><\/div>\n<div class=\"quiz-q\"><b>2. Ideal kondensatorli zanjirda tok kuchi kuchlanishdan necha gradus oldinda?<\/b><label><input type=\"radio\" name=\"q2\" value=\"a\"> 0°<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> 45°<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> 90°<\/label><\/div>\n<div class=\"quiz-q\"><b>3. Chastota ortsa, sig‘im qarshiligi qanday o‘zgaradi?<\/b><label><input type=\"radio\" name=\"q3\" value=\"a\"> Kamayadi<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> Ortadi<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> O‘zgarmaydi<\/label><\/div>\n<div class=\"quiz-q\"><b>4. Sig‘im qarshiligi formulasi qaysi?<\/b><label><input type=\"radio\" name=\"q4\" value=\"a\"> X꜀ = 2πfC<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> X꜀ = U/I<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> X꜀ = 1/(2πfC)<\/label><\/div>\n<div class=\"quiz-q\"><b>5. Sig‘im o‘zgarmasa, kuchlanish ortishi bilan ideal kondensatordagi tok amplitudasi qanday o‘zgaradi?<\/b><label><input type=\"radio\" name=\"q5\" value=\"a\"> Ortadi<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Kamayadi<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Doim nol bo‘ladi<\/label><\/div>\n<button type=\"submit\">Javoblarni tekshirish<\/button><button type=\"button\" class=\"secondary\" id=\"resetQuiz\">Qayta ishlash<\/button><div id=\"quizResult\" class=\"result\" aria-live=\"polite\"><\/div>\n<\/form>\n<\/section>\n<section class=\"card\"><h2>Xulosa<\/h2><ul><li>Kondensator elektr zaryadini va elektr maydon energiyasini to‘playdi.<\/li><li>Ideal kondensatorli zanjirda tok kuchi kuchlanishdan 90° oldinda bo‘ladi.<\/li><li>Sig‘im qarshiligi X꜀ = 1/(2πfC); chastota yoki sig‘im oshsa, u kamayadi.<\/li><li>Bir xil kuchlanishda sig‘im qarshiligi kamayishi tokning ortishiga olib keladi.<\/li><\/ul><p class=\"mini\">Eslatma: bu simulyatsiya ideal kondensator modeliga asoslangan; haqiqiy kondensatorlarda yo‘qotishlar va boshqa omillar ham mavjud bo‘lishi mumkin.<\/p><\/section>\n<\/main>\n<footer>Interaktiv o‘quv materiali • 11-sinf fizika<\/footer>\n<script>\nconst $=id=>document.getElementById(id);\nfunction drawGrid(ctx,w,h){ctx.clearRect(0,0,w,h);ctx.strokeStyle='#e7edf5';ctx.lineWidth=1;for(let x=0;x<=w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<=h;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}ctx.strokeStyle='#91a0b5';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke()}\nlet phaseT=0, running=true, animFrame=null;\nfunction drawPhase(){const c=$('phaseCanvas'),ctx=c.getContext('2d'),w=c.width,h=c.height;drawGrid(ctx,w,h);let f=+$('freq2').value,amp=+$('amp2').value;ctx.lineWidth=3;\n[[Math.sin,'#2463eb',0],[Math.cos,'#e5484d',Math.PI/2]].forEach(([fn,color,shift])=>{ctx.beginPath();ctx.strokeStyle=color;for(let x=0;x<w;x++){let t=x/w*2*Math.PI*2+phaseT;let y=h/2-(h*.34)*(amp/20)*fn(t+shift);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke()});\nctx.fillStyle='#2463eb';ctx.font='bold 16px sans-serif';ctx.fillText('u(t)',12,20);ctx.fillStyle='#e5484d';ctx.fillText('i(t)',65,20);\n}\nfunction animate(){if(running){phaseT+=.035;drawPhase()}animFrame=requestAnimationFrame(animate)}\n$('playBtn').onclick=()=>{running=true};$('pauseBtn').onclick=()=>{running=false};$('resetBtn').onclick=()=>{phaseT=0;drawPhase()};\n$('freq2').oninput=()=>{$('freq2out').textContent=$('freq2').value;drawPhase()};$('amp2').oninput=()=>{$('amp2out').textContent=$('amp2').value;drawPhase()};\n$('phaseCanvas').addEventListener('click',e=>{let r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;let t=x*2*Math.PI*2;let u=+$('amp2').value*Math.sin(t+phaseT);let i=Math.cos(t+phaseT);$('pointRead').textContent=`Tanlangan nuqta: u ≈ ${u.toFixed(2)} V; tok grafigining nisbiy qiymati ≈ ${i.toFixed(2)}. Ideal fazalar farqi 90°.`});\nfunction updateCharge(){let U=+$('v1').value,f=+$('f1').value;let t=Date.now()/1000*2*Math.PI*f/5;let v=Math.sin(t),q=100*U/10*v;$('v1out').textContent=U;$('f1out').textContent=f;$('qread').textContent=`Zaryad: ${Math.abs(q).toFixed(1)} μC (${q>=0?'musbat plastina':'qarama-qarshi ishora'})`;$('charge1').textContent=q>=0?'+ + +':'− − −';$('p1').style.background=q>=0?'#e5484d':'#2463eb';$('p2').style.background=q>=0?'#2463eb':'#e5484d';$('fieldText').textContent=q>=0?'Elektr maydon chapdan o‘ngga yo‘nalgan deb tasvirlangan.':'Elektr maydon yo‘nalishi teskari tomonga almashdi.';requestAnimationFrame(updateCharge)}\n$('v1').oninput=()=>{$('v1out').textContent=$('v1').value};$('f1').oninput=()=>{$('f1out').textContent=$('f1').value};\nfunction updateXC(){let C=+$('cap3').value*1e-6,f=+$('freq3').value,U=+$('volt3').value;let X=1/(2*Math.PI*f*C),I=U/X;$('cap3out').textContent=$('cap3').value;$('freq3out').textContent=f;$('volt3out').textContent=U;$('xcResult').textContent=`X꜀ = ${X.toFixed(2)} Ω`;$('iResult').textContent=`I = ${I.toFixed(4)} A (${(I*1000).toFixed(2)} mA)`;drawXC()}\n['cap3','freq3','volt3'].forEach(id=>$(id).addEventListener('input',updateXC));\nfunction drawXC(){let c=$('xcCanvas'),ctx=c.getContext('2d'),w=c.width,h=c.height;drawGrid(ctx,w,h);let C=+$('cap3').value*1e-6;ctx.strokeStyle='#0f9d91';ctx.lineWidth=3;ctx.beginPath();for(let x=0;x<w;x++){let f=10+x/w*990;let X=1/(2*Math.PI*f*C);let y=h-20-(Math.min(X,2000)/2000)*(h-40);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.fillStyle='#0f766e';ctx.font='bold 15px sans-serif';ctx.fillText('X꜀ (Ω)',10,20);ctx.fillStyle='#5b6b82';ctx.font='13px sans-serif';ctx.fillText('10 Hz',8,h-7);ctx.fillText('1000 Hz',w-80,h-7)}\nfunction calcLab(){let C=+$('labC').value*1e-6,f=+$('labF').value,U=+$('labU').value;if(!(C>0&&f>0&&U>=0))return null;let X=1/(2*Math.PI*f*C),I=U/X;$('labResult').textContent=`X꜀ = ${X.toFixed(2)} Ω`;$('labCurrent').textContent=`I = ${I.toFixed(5)} A (${(I*1000).toFixed(2)} mA)`;return {C:+$('labC').value,f,U,X,I}}\n['labC','labF','labU'].forEach(id=>$(id).addEventListener('input',calcLab));\n$('addRow').onclick=()=>{let d=calcLab();if(!d){alert('Musbat sig‘im va chastota kiriting.');return}let body=$('labRows'),tr=document.createElement('tr');[body.rows.length+1,d.C,d.f,d.U,d.X.toFixed(2),d.I.toFixed(5)].forEach(v=>{let td=document.createElement('td');td.textContent=v;tr.appendChild(td)});body.appendChild(tr)};\n$('clearRows').onclick=()=>{$('labRows').innerHTML=''};\n$('quizForm').onsubmit=e=>{e.preventDefault();let ans={q1:'b',q2:'c',q3:'a',q4:'c',q5:'a'},score=0;for(let [q,a] of Object.entries(ans)){let chosen=document.querySelector(`input[name=\"${q}\"]:checked`);if(chosen&&chosen.value===a)score++}$('quizResult').textContent=`Natija: ${score}/5 ball. ${score===5?'A’lo! Barcha javoblar to‘g‘ri.':score>=3?'Yaxshi! Xatolarni ko‘rib, mavzuni yana takrorlang.':'Mavzuni qayta o‘rganib, yana urinib ko‘ring.'}`};\n$('resetQuiz').onclick=()=>{$('quizForm').reset();$('quizResult').textContent=''};\ndrawPhase();animate();updateXC();calcLab();updateCharge();\n<\/script>\n<\/body>\n<\/html>"];
function openTopic(i){document.getElementById('home').style.display='none';document.getElementById('view').style.display='flex';document.getElementById('frame').srcdoc=PAGES[i];}
function goHome(){document.getElementById('view').style.display='none';document.getElementById('home').style.display='block';document.getElementById('frame').srcdoc='';}
</script></body></html>
