const PAGES=["<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Tokli o'tkazgichni magnit maydonida ko'chirishda bajarilgan ish<\/title>\n<style>\n  :root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--accent:#2457d6;--soft:#eaf0ff;--line:#dbe2ef}\n  *{box-sizing:border-box}\n  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}\n  header{background:linear-gradient(135deg,#173b9a,#3974e8);color:white;padding:48px 20px;text-align:center}\n  header h1{margin:0 auto 10px;max-width:1000px;font-size:clamp(28px,5vw,46px)}\n  header p{margin:0;font-size:18px}\n  main{max-width:1100px;margin:30px auto;padding:0 18px}\n  section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;margin-bottom:24px;box-shadow:0 8px 24px rgba(30,50,90,.06)}\n  h2{color:var(--accent);margin-top:0}\n  h3{color:#25406f}\n  .formula{background:var(--soft);border-left:5px solid var(--accent);padding:15px 20px;margin:16px 0;border-radius:8px;font-size:22px;font-weight:bold;text-align:center}\n  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}\n  .box{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fafcff}\n  .example{background:#fff9e8;border-left:5px solid #e1a800;padding:16px 20px;border-radius:8px}\n  .prompt{background:#101827;color:#e9eef9;border-radius:12px;padding:18px;white-space:pre-wrap;font-family:Consolas,monospace;font-size:14px;overflow:auto}\n  .tag{display:inline-block;background:#eaf0ff;color:#244aa8;border-radius:20px;padding:5px 11px;margin:3px;font-weight:bold}\n  footer{text-align:center;color:#68748a;padding:25px}\n  @media print{body{background:white}section{box-shadow:none;break-inside:avoid}.prompt{color:#111;background:#f2f2f2}}\n<\/style>\n<\/head>\n<body>\n<header>\n  <h1>Tokli o'tkazgichni magnit maydonida ko'chirishda bajarilgan ish<\/h1>\n  <p>11-sinf fizika fani uchun nazariya, formulalar, misollar va animatsiya/simulyatsiya promptlari<\/p>\n<\/header>\n\n<main>\n<section>\n  <h2>Dars rejasi<\/h2>\n  <div class=\"tag\">1. Amper kuchi<\/div>\n  <div class=\"tag\">2. Vektorial ko'rinish<\/div>\n  <div class=\"tag\">3. Bajarilgan ish va energiya<\/div>\n  <p><b>Eslatma:<\/b> dastlabki 3-reja 1-reja bilan bir xil bo'lgani uchun mazmun takrorlanmasligi maqsadida 3-reja “Tokli o'tkazgichni magnit maydonida ko'chirishda bajarilgan ish va energiya” sifatida ishlab chiqildi.<\/p>\n<\/section>\n\n<section>\n  <h2>1-reja. Magnit maydonidagi tokli o'tkazgichga ta'sir etuvchi kuchlar va ularni hisoblash usullari<\/h2>\n  <p>Magnit maydoniga joylashtirilgan tokli o'tkazgichga <b>Amper kuchi<\/b> ta'sir qiladi.<\/p>\n  <div class=\"formula\">F<sub>A<\/sub> = BIl sin α<\/div>\n  <div class=\"grid\">\n    <div class=\"box\"><b>F<sub>A<\/sub><\/b> — Amper kuchi, N<\/div>\n    <div class=\"box\"><b>B<\/b> — magnit induksiyasi, T<\/div>\n    <div class=\"box\"><b>I<\/b> — tok kuchi, A<\/div>\n    <div class=\"box\"><b>l<\/b> — magnit maydonidagi o'tkazgich uzunligi, m<\/div>\n    <div class=\"box\"><b>α<\/b> — tok yo'nalishi bilan magnit induksiya vektori orasidagi burchak<\/div>\n  <\/div>\n  <p>Agar o'tkazgich magnit maydoniga perpendikulyar joylashgan bo'lsa, α = 90° va sin 90° = 1.<\/p>\n  <div class=\"formula\">F<sub>A<\/sub> = BIl<\/div>\n  <p>Amper kuchining yo'nalishi <b>chap qo'l qoidasi<\/b> yordamida aniqlanadi.<\/p>\n\n  <div class=\"example\">\n    <h3>Misol<\/h3>\n    <p>B = 0.5 T, I = 4 A, l = 0.2 m, α = 90°.<\/p>\n    <p>F<sub>A<\/sub> = 0.5 × 4 × 0.2 = <b>0.4 N<\/b>.<\/p>\n  <\/div>\n\n  <h3>🎬 Simulyatsiya prompti<\/h3>\n  <div class=\"prompt\">11-sinf fizika darsi uchun realistik 3D fizik simulyatsiya yarating. Mavzu: “Magnit maydonidagi tokli o'tkazgichga ta'sir qiluvchi Amper kuchi”.\n\nGorizontal joylashgan to'g'ri metall o'tkazgichni ko'rsating. O'tkazgichdan chapdan o'ngga elektr toki I = 4 A oqsin. O'tkazgich bir jinsli magnit maydonida joylashgan bo'lsin. Magnit maydon yo'nalishini parallel strelkalar bilan ko'rsating va B = 0.5 T deb belgilang.\n\nO'tkazgichga ta'sir qilayotgan Amper kuchini katta vektor strelka bilan ko'rsating. F_A = BIL formulasi ekranda paydo bo'lsin. Qiymatlar: B=0.5 T, I=4 A, l=0.2 m. Natija F_A=0.4 N.\n\nKeyin chap qo'l qoidasini animatsiya orqali tushuntiring: magnit maydon yo'nalishi, tok yo'nalishi va Amper kuchi yo'nalishini uchta alohida strelka bilan ko'rsating.\n\nIlmiy jihatdan aniq, maktab darsligi uslubida, yorqin va tushunarli 3D animatsiya, o'zbek tilidagi yozuvlar, 16:9 format.<\/div>\n<\/section>\n\n<section>\n  <h2>2-reja. Magnit maydonida ko'chayotgan o'tkazgichdagi fizik jarayonlar va Amper kuchining vektorial ko'rinishi<\/h2>\n  <p>Tokli o'tkazgich magnit maydonida harakat qilganda unga Amper kuchi ta'sir qiladi.<\/p>\n  <div class=\"formula\">⃗F<sub>A<\/sub> = I⃗l × ⃗B<\/div>\n  <p>Bu yerda ⃗F<sub>A<\/sub> — Amper kuchi vektori, I⃗l — tok yo'nalishidagi vektor, ⃗B — magnit induksiya vektori, × — vektorlarning tashqi ko'paytmasi.<\/p>\n  <p>Magnit maydonida jarayonlar zanjiri:<\/p>\n  <div class=\"formula\">Elektr toki → Magnit maydoni → Amper kuchi → O'tkazgichning mexanik harakati<\/div>\n  <p>Agar o'zgartgich magnit maydonida kuch ta'sirida siljisa, mexanik ish bajariladi.<\/p>\n  <div class=\"formula\">A = F<sub>A<\/sub>s<\/div>\n  <div class=\"formula\">A = BIls sin α<\/div>\n\n  <h3>🎬 Simulyatsiya prompti<\/h3>\n  <div class=\"prompt\">11-sinf fizika uchun yuqori sifatli 3D animatsion simulyatsiya yarating. Mavzu: “Magnit maydonida tokli o'tkazgichning harakati va Amper kuchining vektorial ko'rinishi”.\n\nKadrda ikkita magnit qutbi orasidagi bir jinsli magnit maydonini ko'rsating. Magnit induksiya vektori B ni parallel strelkalar yordamida belgilang.\n\nMagnit maydon ichida tok o'tayotgan metall o'tkazgich joylashsin. Tok yo'nalishini I va l vektorlari bilan ko'rsating. Keyin Amper kuchi vektorini F_A bilan ko'rsating.\n\nEkranda vektor formula paydo bo'lsin:\nF_A = I l × B\n\nVektorlarning o'zaro perpendikulyar ekanini 3D ko'rinishda ko'rsating. So'ng o'tkazgich Amper kuchi yo'nalishida harakatlana boshlasin. Harakat masofasini s bilan belgilang.\n\nKeyingi bosqichda:\nA = F_A · s\nva\nA = B I l s sin(alpha)\nformulalarini ko'rsating.\n\nAnimatsiyada kuch o'tkazgichni siljitayotgani, mexanik ish bajarilayotgani va energiya uzatilayotganini vizual ravishda tushuntiring.\n\nO'zbek tilidagi yozuvlar, maktab laboratoriyasi uslubidagi 3D grafika, aniq vektor strelkalar, fizik qonunlarga mos harakat, 16:9 format.<\/div>\n<\/section>\n\n<section>\n  <h2>3-reja. Tokli o'tkazgichni magnit maydonida ko'chirishda bajarilgan ish va energiya<\/h2>\n  <p>Magnit maydonidagi tokli o'tkazgichga Amper kuchi ta'sir qiladi. Agar o'tkazgich shu kuch yo'nalishida ma'lum masofaga ko'chirilsa, mexanik ish bajariladi.<\/p>\n  <div class=\"formula\">A = Fs cos β<\/div>\n  <p>Amper kuchi uchun:<\/p>\n  <div class=\"formula\">A = F<sub>A<\/sub>s cos β<\/div>\n  <p>Agar kuch va ko'chish bir yo'nalishda bo'lsa, β = 0° va:<\/p>\n  <div class=\"formula\">A = F<sub>A<\/sub>s<\/div>\n  <p>F<sub>A<\/sub> = BIl sin α ekanini hisobga olsak:<\/p>\n  <div class=\"formula\">A = BIls sin α<\/div>\n\n  <div class=\"example\">\n    <h3>Misol<\/h3>\n    <p>B = 0.4 T, I = 5 A, l = 0.3 m, s = 0.2 m, α = 90°.<\/p>\n    <p>F<sub>A<\/sub> = 0.4 × 5 × 0.3 = <b>0.6 N<\/b>.<\/p>\n    <p>A = 0.6 × 0.2 = <b>0.12 J<\/b>.<\/p>\n    <p><b>Javob: A = 0.12 J.<\/b><\/p>\n  <\/div>\n\n  <h3>🎬 Yakuniy animatsiya prompti<\/h3>\n  <div class=\"prompt\">11-sinf fizika faniga mo'ljallangan ta'limiy 3D animatsiya yarating. Mavzu: “Tokli o'tkazgichni magnit maydonida ko'chirishda bajarilgan ish”.\n\nBir jinsli magnit maydonini ko'rsating. Magnit induksiya B = 0.4 T. Magnit maydon ichida uzunligi l = 0.3 m bo'lgan tokli o'tkazgich joylashsin. Undan I = 5 A tok oqsin.\n\nO'tkazgichga ta'sir qiluvchi Amper kuchini F_A strelkasi bilan ko'rsating. O'tkazgich Amper kuchi yo'nalishida s = 0.2 m masofaga harakatlansin. Harakat davomida masofa o'lchagich animatsiyasi paydo bo'lsin.\n\nAvval:\nF_A = B I l sin(alpha)\nformulasini ko'rsating.\n\nalpha = 90° ekanini ko'rsating va:\nF_A = 0.4 × 5 × 0.3 = 0.6 N\nhisobini bosqichma-bosqich animatsiya qiling.\n\nKeyin mexanik ish formulasini ko'rsating:\nA = F_A s\n\nHisob:\nA = 0.6 × 0.2 = 0.12 J\n\nYakuniy ekranda katta yozuv bilan:\n“Bajarilgan ish: A = 0.12 J”\n\ndeb ko'rsating.\n\nMagnit maydoni, tok yo'nalishi, Amper kuchi va o'tkazgichning harakatini aniq strelkalar bilan ajrating. Formulalar va o'zbek tilidagi izohlar birga paydo bo'lsin. Ilmiy jihatdan to'g'ri, 11-sinf o'quvchisi uchun sodda va tushunarli, zamonaviy maktab laboratoriyasi uslubidagi 3D animatsiya, 16:9 format.<\/div>\n<\/section>\n\n<section>\n  <h2>🎥 Uchta animatsiyani bitta darsga birlashtirish uchun yakuniy prompt<\/h2>\n  <div class=\"prompt\">11-sinf fizika fani uchun “Tokli o'tkazgichni magnit maydonida ko'chirishda bajarilgan ish” mavzusida interaktiv 3D ta'limiy animatsiya va simulyatsiya yarating.\n\nAnimatsiya 3 ta asosiy bo'limdan iborat bo'lsin:\n\n1-bo'lim:\n“Magnit maydonidagi tokli o'tkazgichga ta'sir etuvchi Amper kuchi”.\nB = 0.5 T, I = 4 A, l = 0.2 m qiymatlarni ishlating.\nF_A = BIl sin(alpha) formulasini tushuntiring.\nalpha = 90° bo'lganda F_A = 0.4 N natijani ko'rsating.\nChap qo'l qoidasi yordamida kuch yo'nalishini tushuntiring.\n\n2-bo'lim:\n“Magnit maydonida ko'chayotgan o'tkazgich va Amper kuchining vektorial ko'rinishi”.\nF_A = I l × B formulasini 3D vektorlar yordamida tushuntiring.\nB, I l va F_A vektorlarini alohida strelkalar bilan ko'rsating.\nO'tkazgichning Amper kuchi ta'sirida siljishini animatsiya qiling.\n\n3-bo'lim:\n“Tokli o'tkazgichni ko'chirishda bajarilgan ish”.\nB = 0.4 T, I = 5 A, l = 0.3 m, s = 0.2 m qiymatlarini ishlating.\nAvval F_A = 0.6 N ni hisoblang.\nKeyin A = F_A s formulasi orqali A = 0.12 J natijani oling.\nFormulalar va hisob-kitoblar ekranda bosqichma-bosqich paydo bo'lsin.\n\nHar bir bo'limda fizik kattaliklarning belgilanishi, o'lchov birliklari va vektor yo'nalishlari aniq ko'rsatilishi kerak. Animatsiya o'zbek tilida, 11-sinf darajasida, zamonaviy laboratoriya ko'rinishida, ilmiy jihatdan aniq, 16:9 formatda bo'lsin.<\/div>\n<\/section>\n<\/main>\n\n<footer>\n  11-sinf fizika • Tokli o'tkazgichni magnit maydonida ko'chirishda bajarilgan ish\n<\/footer>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Elektromagnit induksiya — 11-sinf fizika<\/title>\n<style>\n*{box-sizing:border-box}\nbody{margin:0;font-family:Arial,sans-serif;background:#eef4fb;color:#172033;line-height:1.5}\nheader{background:linear-gradient(135deg,#163b70,#2879c7);color:white;padding:28px 16px;text-align:center}\nheader h1{margin:0 0 8px;font-size:clamp(24px,5vw,38px)}\nheader p{margin:0;opacity:.92}\n.container{max-width:1100px;margin:auto;padding:18px}\nnav{position:sticky;top:0;z-index:5;background:white;padding:10px;box-shadow:0 2px 8px #0002;display:flex;gap:8px;overflow:auto}\nnav button,.btn{border:0;border-radius:10px;padding:10px 14px;background:#2879c7;color:white;cursor:pointer;font-weight:bold}\nnav button:hover,.btn:hover{background:#163b70}\nsection{background:white;margin:18px 0;padding:22px;border-radius:16px;box-shadow:0 3px 14px #0001}\nh2{color:#163b70;margin-top:0}\nh3{color:#2879c7}\n.formula{font-size:1.35rem;text-align:center;background:#edf6ff;border-left:5px solid #2879c7;padding:14px;margin:14px 0;border-radius:8px;font-weight:bold}\n.note{background:#fff8df;border-left:5px solid #e2a800;padding:12px;border-radius:8px}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}\n.card{background:#f7faff;border:1px solid #dce8f5;border-radius:12px;padding:15px}\n.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:15px 0}\nlabel{font-weight:bold;display:block}\ninput[type=range]{width:100%}\n.value{font-weight:bold;color:#163b70}\n.canvas-wrap{background:#0e1726;border-radius:14px;padding:10px;overflow:hidden}\ncanvas{width:100%;height:330px;display:block;background:#101b2d;border-radius:10px}\n.status{padding:12px;border-radius:10px;background:#e9f7ee;margin-top:10px;font-weight:bold}\n.quiz-q{padding:14px;border:1px solid #dbe5ef;border-radius:10px;margin:10px 0}\n.result{font-size:1.1rem;font-weight:bold;margin-top:12px}\n.small{font-size:.92rem;color:#536173}\nul{padding-left:22px}\n<\/style>\n<\/head>\n<body>\n<header>\n<h1>Elektromagnit induksiya hodisasi<\/h1>\n<p>11-sinf fizika • Faradey qonuni • Induksiya EYUK • Magnit oqimi • Lens qoidasi<\/p>\n<\/header>\n\n<nav>\n<button onclick=\"go('faraday')\">1. Faradey qonuni<\/button>\n<button onclick=\"go('flux')\">2. Magnit oqimi<\/button>\n<button onclick=\"go('lenz')\">3. Lens qoidasi<\/button>\n<button onclick=\"go('quiz')\">Test<\/button>\n<\/nav>\n\n<main class=\"container\">\n<section id=\"faraday\">\n<h2>1. Faradeyning elektromagnit induksiya qonuni va induksiya EYUK<\/h2>\n<p><b>Elektromagnit induksiya<\/b> — konturdan o'tuvchi magnit oqimi o'zgarganda unda induksiya elektr yurituvchi kuchi (EYUK) hosil bo'lish hodisasidir.<\/p>\n<div class=\"formula\">εᵢ = − N · ΔΦ / Δt<\/div>\n<div class=\"grid\">\n<div class=\"card\"><b>εᵢ<\/b> — induksiya EYUK, volt (V)<\/div>\n<div class=\"card\"><b>N<\/b> — g'altakdagi o'ramlar soni<\/div>\n<div class=\"card\"><b>ΔΦ<\/b> — magnit oqimining o'zgarishi, weber (Wb)<\/div>\n<div class=\"card\"><b>Δt<\/b> — vaqt oralig'i, sekund (s)<\/div>\n<\/div>\n<div class=\"note\"><b>Muhim:<\/b> minus ishora induksion tok yo'nalishi magnit oqimidagi o'zgarishga qarshilik qilishini bildiradi.<\/div>\n\n<h3>Interaktiv Faradey tajribasi<\/h3>\n<div class=\"canvas-wrap\"><canvas id=\"faradayCanvas\"><\/canvas><\/div>\n<div class=\"controls\">\n<div><label>Magnit harakati<\/label><input id=\"motion\" type=\"range\" min=\"-100\" max=\"100\" value=\"0\"><div>Tezlik: <span class=\"value\" id=\"motionVal\">0<\/span><\/div><\/div>\n<div><label>O'ramlar soni N<\/label><input id=\"turns\" type=\"range\" min=\"1\" max=\"100\" value=\"20\"><div>N = <span class=\"value\" id=\"turnsVal\">20<\/span><\/div><\/div>\n<div><label>Magnit oqimi o'zgarishi ΔΦ (Wb)<\/label><input id=\"dphi\" type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.2\"><div>ΔΦ = <span class=\"value\" id=\"dphiVal\">0.20<\/span> Wb<\/div><\/div>\n<div><label>Vaqt Δt (s)<\/label><input id=\"dt\" type=\"range\" min=\"0.1\" max=\"5\" step=\"0.1\" value=\"1\"><div>Δt = <span class=\"value\" id=\"dtVal\">1.0<\/span> s<\/div><\/div>\n<\/div>\n<div class=\"status\" id=\"faradayStatus\"><\/div>\n<\/section>\n\n<section id=\"flux\">\n<h2>2. Elektromagnit induksiya hodisasi va magnit oqimi<\/h2>\n<p>Magnit oqimi — magnit maydonning ma'lum yuzadan o'tishini ifodalovchi fizik kattalik.<\/p>\n<div class=\"formula\">Φ = B · S · cos α<\/div>\n<div class=\"grid\">\n<div class=\"card\"><b>B<\/b> — magnit induksiya, tesla (T)<\/div>\n<div class=\"card\"><b>S<\/b> — kontur yuzi, m²<\/div>\n<div class=\"card\"><b>α<\/b> — magnit maydon bilan sirt normalining burchagi<\/div>\n<div class=\"card\"><b>1 Wb = 1 T·m²<\/b><\/div>\n<\/div>\n\n<h3>Magnit oqimi simulyatsiyasi<\/h3>\n<div class=\"canvas-wrap\"><canvas id=\"fluxCanvas\"><\/canvas><\/div>\n<div class=\"controls\">\n<div><label>B (T)<\/label><input id=\"B\" type=\"range\" min=\"0\" max=\"2\" step=\"0.01\" value=\"1\"><div>B = <span class=\"value\" id=\"BVal\">1.00<\/span> T<\/div><\/div>\n<div><label>S (m²)<\/label><input id=\"S\" type=\"range\" min=\"0.1\" max=\"5\" step=\"0.1\" value=\"2\"><div>S = <span class=\"value\" id=\"SVal\">2.0<\/span> m²<\/div><\/div>\n<div><label>α (°)<\/label><input id=\"angle\" type=\"range\" min=\"0\" max=\"180\" value=\"0\"><div>α = <span class=\"value\" id=\"angleVal\">0<\/span>°<\/div><\/div>\n<\/div>\n<div class=\"formula\">Φ = <span id=\"fluxResult\">2.00<\/span> Wb<\/div>\n<div class=\"status\" id=\"fluxStatus\"><\/div>\n<\/section>\n\n<section id=\"lenz\">\n<h2>3. Induksion tok yo'nalishi va Lens qoidasi<\/h2>\n<p><b>Lens qoidasi:<\/b> induksion tok shunday yo'naladiki, uning hosil qilgan magnit maydoni magnit oqimidagi o'zgarishga qarshilik qiladi.<\/p>\n<div class=\"grid\">\n<div class=\"card\"><b>Magnit yaqinlashsa:<\/b> oqim ortadi va g'altakning yaqin tomoni magnitni itarishga intiladi.<\/div>\n<div class=\"card\"><b>Magnit uzoqlashsa:<\/b> oqim kamayadi va g'altak magnitni tortishga intiladi.<\/div>\n<div class=\"card\"><b>Magnit to'xtasa:<\/b> oqim o'zgarmaydi, induksion tok ham nolga teng.<\/div>\n<\/div>\n\n<h3>Lens qoidasi simulyatsiyasi<\/h3>\n<div class=\"canvas-wrap\"><canvas id=\"lenzCanvas\"><\/canvas><\/div>\n<div class=\"controls\">\n<div><label>Magnit harakat yo'nalishi<\/label><input id=\"lenzMotion\" type=\"range\" min=\"-100\" max=\"100\" value=\"60\"><div>Tezlik: <span class=\"value\" id=\"lenzVal\">60<\/span><\/div><\/div>\n<div><label>Magnit qutbi<\/label><select id=\"pole\" style=\"width:100%;padding:10px;border-radius:8px\"><option value=\"N\">N — Shimoliy<\/option><option value=\"S\">S — Janubiy<\/option><\/select><\/div>\n<\/div>\n<div class=\"status\" id=\"lenzStatus\"><\/div>\n<\/section>\n\n<section id=\"quiz\">\n<h2>O'zingizni sinang<\/h2>\n<div class=\"quiz-q\">1. Faradey qonunining ifodasi qaysi?<br>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> ε = IR<\/label><br>\n<label><input type=\"radio\" name=\"q1\" value=\"b\"> εᵢ = −NΔΦ/Δt<\/label><br>\n<label><input type=\"radio\" name=\"q1\" value=\"c\"> Φ = B/S<\/label><\/div>\n<div class=\"quiz-q\">2. Magnit oqimi formulasi?<br>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Φ = BS cos α<\/label><br>\n<label><input type=\"radio\" name=\"q2\" value=\"b\"> Φ = B/S<\/label><br>\n<label><input type=\"radio\" name=\"q2\" value=\"c\"> Φ = IR<\/label><\/div>\n<div class=\"quiz-q\">3. Magnit harakatsiz turganda, ideal holatda induksion tok qanday bo'ladi?<br>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> Maksimal<\/label><br>\n<label><input type=\"radio\" name=\"q3\" value=\"b\"> Nol<\/label><br>\n<label><input type=\"radio\" name=\"q3\" value=\"c\"> Cheksiz<\/label><\/div>\n<div class=\"quiz-q\">4. Lens qoidasi nimani aniqlashga yordam beradi?<br>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> Induksion tok yo'nalishini<\/label><br>\n<label><input type=\"radio\" name=\"q4\" value=\"b\"> Faqat massani<\/label><br>\n<label><input type=\"radio\" name=\"q4\" value=\"c\"> Haroratni<\/label><\/div>\n<div class=\"quiz-q\">5. Magnit oqimining SI birligi?<br>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> Volt<\/label><br>\n<label><input type=\"radio\" name=\"q5\" value=\"b\"> Tesla<\/label><br>\n<label><input type=\"radio\" name=\"q5\" value=\"c\"> Weber<\/label><\/div>\n<button class=\"btn\" onclick=\"checkQuiz()\">Natijani tekshirish<\/button>\n<div id=\"quizResult\" class=\"result\"><\/div>\n<\/section>\n<\/main>\n\n<script>\nfunction go(id){document.getElementById(id).scrollIntoView({behavior:'smooth'});}\n\nconst $=id=>document.getElementById(id);\nfunction resizeCanvas(c){\n  const r=c.getBoundingClientRect(), d=devicePixelRatio||1;\n  c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return x;\n}\nfunction drawFaraday(){\n const c=$('faradayCanvas'),x=resizeCanvas(c),w=c.clientWidth,h=c.clientHeight;\n x.clearRect(0,0,w,h);\n const speed=+$('motion').value, t=performance.now()/1000;\n // field lines\n x.strokeStyle='#4ca3ff';x.lineWidth=2;\n for(let i=-5;i<=5;i++){x.beginPath();x.moveTo(w*.55+i*12,35);x.lineTo(w*.55+i*12,h-35);x.stroke();}\n // coil\n x.strokeStyle='#f2c14e';x.lineWidth=5;\n for(let i=0;i<8;i++){x.beginPath();x.ellipse(w*.62,h/2,35+i*4,105,0,0,Math.PI*2);x.stroke();}\n // magnet\n const mx=w*.25+Math.sin(t*speed*.015)*45;\n x.fillStyle='#e64b4b';x.fillRect(mx-42,h/2-38,42,76);\n x.fillStyle='#4b72d8';x.fillRect(mx,h/2-38,42,76);\n x.fillStyle='white';x.font='bold 24px Arial';x.fillText('N',mx-30,h/2+8);x.fillText('S',mx+12,h/2+8);\n // galvanometer\n x.strokeStyle='white';x.lineWidth=2;x.beginPath();x.arc(w*.86,h/2,48,Math.PI,2*Math.PI);x.stroke();\n const val=Math.max(-1,Math.min(1,speed/100))*Math.PI*.65;\n x.beginPath();x.moveTo(w*.86,h/2);x.lineTo(w*.86+38*Math.cos(Math.PI-val),h/2+38*Math.sin(Math.PI-val));x.stroke();\n x.fillStyle='white';x.font='14px Arial';x.fillText('G',w*.86-7,h/2+6);\n requestAnimationFrame(drawFaraday);\n}\nfunction updateFaraday(){\n $('motionVal').textContent=$('motion').value;\n $('turnsVal').textContent=$('turns').value;\n $('dphiVal').textContent=(+$('dphi').value).toFixed(2);\n $('dtVal').textContent=(+$('dt').value).toFixed(1);\n const e=+$('turns').value*+$('dphi').value/+ $('dt').value;\n const m=+$('motion').value;\n $('faradayStatus').innerHTML=`Induksiya EYUK: <b>εᵢ = ${e.toFixed(3)} V<\/b> &nbsp; | &nbsp; ${m===0?'Magnit harakatsiz — induksiya hosil bo‘lishi uchun magnit oqimi o‘zgarishi kerak.':m>0?'Magnit harakatlanmoqda — induksion EYUK mavjud.':'Magnit qarama-qarshi yo‘nalishda harakatlanmoqda — tok yo‘nalishi teskari.'}`;\n}\n['motion','turns','dphi','dt'].forEach(id=>$(id).addEventListener('input',updateFaraday));\n\nfunction drawFlux(){\n const c=$('fluxCanvas'),x=resizeCanvas(c),w=c.clientWidth,h=c.clientHeight;\n x.clearRect(0,0,w,h);\n const a=+$('angle').value*Math.PI/180;\n // field\n x.strokeStyle='#4ca3ff';x.lineWidth=2;\n for(let y=35;y<h-20;y+=25){x.beginPath();x.moveTo(15,y);x.lineTo(w-15,y);x.stroke();}\n // tilted surface rectangle\n x.save();x.translate(w/2,h/2);x.rotate(a-Math.PI/2);\n x.strokeStyle='#f2c14e';x.lineWidth=5;x.strokeRect(-120,-70,240,140);\n x.restore();\n // normal\n x.strokeStyle='#ff8c42';x.lineWidth=4;x.beginPath();x.moveTo(w/2,h/2);x.lineTo(w/2,h/2-95);x.stroke();\n x.fillStyle='white';x.font='bold 16px Arial';x.fillText('Sirt',w/2-20,h/2+100);\n x.fillStyle='#ff8c42';x.fillText('normal',w/2+8,h/2-98);\n requestAnimationFrame(drawFlux);\n}\nfunction updateFlux(){\n const B=+$('B').value,S=+$('S').value,a=+$('angle').value*Math.PI/180;\n const phi=B*S*Math.cos(a);\n $('BVal').textContent=B.toFixed(2);$('SVal').textContent=S.toFixed(1);$('angleVal').textContent=$('angle').value;\n $('fluxResult').textContent=phi.toFixed(3);\n $('fluxStatus').innerHTML=+$('angle').value===90?'α = 90°: magnit oqimi Φ = 0 Wb.':`Magnit oqimi <b>${phi.toFixed(3)} Wb<\/b>. B yoki S oshsa oqim ortadi; α o‘zgarganda esa cos α ga bog‘liq ravishda o‘zgaradi.`;\n}\n['B','S','angle'].forEach(id=>$(id).addEventListener('input',updateFlux));\n\nfunction drawLenz(){\n const c=$('lenzCanvas'),x=resizeCanvas(c),w=c.clientWidth,h=c.clientHeight;\n x.clearRect(0,0,w,h);\n const v=+$('lenzMotion').value, pole=$('pole').value;\n const base=w*.30, mx=base+Math.sin(performance.now()/1000)*Math.abs(v)*.35;\n // coil\n x.strokeStyle='#f2c14e';x.lineWidth=5;\n for(let i=0;i<8;i++){x.beginPath();x.ellipse(w*.62,h/2,35+i*4,105,0,0,Math.PI*2);x.stroke();}\n // magnet\n x.fillStyle=pole==='N'?'#e64b4b':'#4b72d8';x.fillRect(mx-42,h/2-38,42,76);\n x.fillStyle=pole==='N'?'#4b72d8':'#e64b4b';x.fillRect(mx,h/2-38,42,76);\n x.fillStyle='white';x.font='bold 24px Arial';x.fillText(pole,mx-30,h/2+8);\n x.fillText(pole==='N'?'S':'N',mx+12,h/2+8);\n // arrows\n x.strokeStyle='#6ee7a8';x.lineWidth=4;\n const dir=v>0?1:-1;\n x.beginPath();x.moveTo(w*.48,h/2-125);x.lineTo(w*.48+dir*70,h/2-125);x.stroke();\n x.beginPath();x.moveTo(w*.48+dir*70,h/2-125);x.lineTo(w*.48+dir*55,h/2-137);x.moveTo(w*.48+dir*70,h/2-125);x.lineTo(w*.48+dir*55,h/2-113);x.stroke();\n requestAnimationFrame(drawLenz);\n}\nfunction updateLenz(){\n const v=+$('lenzMotion').value;\n $('lenzVal').textContent=v;\n $('lenzStatus').innerHTML=v===0?'<b>Magnit harakatsiz:<\/b> magnit oqimi o‘zgarmaydi, induksion tok nolga yaqin.':v>0?'<b>Magnit g‘altakka yaqinlashmoqda:<\/b> induksion tok magnit oqimining ortishiga qarshilik qiladigan yo‘nalishda hosil bo‘ladi.':'<b>Magnit uzoqlashmoqda:<\/b> induksion tok yo‘nalishi teskari bo‘lib, kamayishni kompensatsiya qilishga intiladi.';\n}\n$('lenzMotion').addEventListener('input',updateLenz);$('pole').addEventListener('change',updateLenz);\n\nfunction checkQuiz(){\n const ans={q1:'b',q2:'a',q3:'b',q4:'a',q5:'c'};let score=0;\n for(const q in ans){const el=document.querySelector(`input[name=\"${q}\"]:checked`);if(el&&el.value===ans[q])score++;}\n $('quizResult').textContent=`Natija: ${score}/5. ${score===5?'A’lo!':score>=3?'Yaxshi natija. Mavzuni yana bir bor takrorlab ko‘ring.':'Formulalar va Lens qoidasini qayta ko‘rib chiqing.'}`;\n}\nupdateFaraday();updateFlux();updateLenz();drawFaraday();drawFlux();drawLenz();\nwindow.addEventListener('resize',()=>{});\n<\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>11-sinf fizika — Magnit maydon energiyasi<\/title>\n<style>\n*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#07152f;color:#eef5ff}\nheader{padding:30px 18px;text-align:center;background:linear-gradient(135deg,#102d63,#40206b)}\nh1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)} h2{color:#9ed8ff}\n.container{max-width:1150px;margin:auto;padding:18px}\n.card{background:#102447;border:1px solid #29477a;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 8px 30px #0004}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}\n.formula{font-size:25px;text-align:center;background:#071a38;padding:18px;border-radius:12px;color:#bde8ff;font-weight:bold}\nlabel{display:block;margin:12px 0 6px} input[type=range]{width:100%} input[type=number]{width:100%;padding:10px;border-radius:8px;border:1px solid #5274a8;background:#07152f;color:white}\nbutton{border:0;border-radius:10px;padding:11px 16px;margin:5px;background:#3c78d8;color:white;font-weight:bold;cursor:pointer} button:hover{filter:brightness(1.15)}\n.value{color:#7fe1ff;font-weight:bold}.result{font-size:23px;padding:14px;background:#071a38;border-radius:12px;margin-top:12px}\n.coil{height:190px;position:relative;overflow:hidden;background:radial-gradient(circle,#183b72,#06142c);border-radius:15px;margin-top:15px}\n.loop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:230px;height:95px;border:7px solid #a9dfff;border-radius:50%;box-shadow:0 0 18px #55cfff}\n.field{position:absolute;left:50%;top:50%;width:280px;height:130px;transform:translate(-50%,-50%);border-top:2px dashed #70d9ff;border-bottom:2px dashed #70d9ff;border-radius:50%;animation:spin 3s linear infinite}\n@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}} \n.meter{height:24px;background:#07152f;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a855f7);transition:.2s}\ncanvas{width:100%;height:260px;background:#07152f;border-radius:12px}\n.quiz{padding:15px;background:#0b1d3d;border-radius:12px;margin:10px 0}.correct{color:#7dffb2}.wrong{color:#ff9c9c}\n.small{color:#b7c8e6;line-height:1.6}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:15px 0}.tabs a{padding:9px 12px;background:#183664;border-radius:8px;color:white;text-decoration:none}\nfooter{text-align:center;padding:25px;color:#9fb2d2}\n<\/style>\n<\/head>\n<body>\n<header>\n<h1>⚡ Magnit maydon energiyasi<\/h1>\n<p>11-sinf fizika • Interaktiv ta’limiy simulyatsiya<\/p>\n<\/header>\n<div class=\"container\">\n<div class=\"tabs\">\n<a href=\"#reja1\">1. Energiya zichligi<\/a><a href=\"#reja2\">2. Magnit energiyasi<\/a><a href=\"#reja3\">3. Induktivlik<\/a><a href=\"#test\">Test<\/a>\n<\/div>\n\n<section class=\"card\" id=\"reja1\">\n<h2>1. Magnit maydonining energiya zichligi va amaliy ahamiyati<\/h2>\n<p class=\"small\">Magnit maydon energiyaga ega. Uning hajm birligiga to‘g‘ri keladigan qismi magnit maydon energiya zichligi deyiladi.<\/p>\n<div class=\"formula\">w = B² / (2μ)<\/div>\n<div class=\"grid\">\n<div><b>w<\/b> — energiya zichligi, J/m³<br><b>B<\/b> — magnit induksiya, T<br><b>μ<\/b> — magnit singdiruvchanlik, H/m<\/div>\n<div><b>Vakuum:<\/b><br>μ₀ = 4π·10⁻⁷ H/m<br><br>Amaliyotda: elektromagnitlar, transformatorlar, generatorlar, dvigatellar va induktorlarda muhim.<\/div>\n<\/div>\n<h3>🔬 Simulyatsiya<\/h3>\n<label>B: <span class=\"value\" id=\"bv\">1.00 T<\/span><\/label>\n<input id=\"B\" type=\"range\" min=\"0\" max=\"2\" step=\"0.01\" value=\"1\">\n<label>μ: <span class=\"value\" id=\"muv\">1.257×10⁻⁶ H/m<\/span><\/label>\n<input id=\"MU\" type=\"range\" min=\"0.0000004\" max=\"0.00001\" step=\"0.0000001\" value=\"0.000001256637\">\n<label>V: <span class=\"value\" id=\"vv\">0.050 m³<\/span><\/label>\n<input id=\"V\" type=\"range\" min=\"0.001\" max=\"0.1\" step=\"0.001\" value=\"0.05\">\n<div class=\"result\">w = <span id=\"w\">0<\/span> J/m³<br>W = wV = <span id=\"wv\">0<\/span> J<\/div>\n<div class=\"coil\"><div class=\"field\"><\/div><div class=\"loop\"><\/div><\/div>\n<div class=\"meter\"><div class=\"fill\" id=\"wf\"><\/div><\/div>\n<\/section>\n\n<section class=\"card\" id=\"reja2\">\n<h2>2. Magnit maydon energiyasi va uni hisoblash<\/h2>\n<p class=\"small\">G‘altakdan tok o‘tganda magnit maydon hosil bo‘ladi va energiya shu maydonda saqlanadi.<\/p>\n<div class=\"formula\">W = LI² / 2<\/div>\n<div class=\"grid\">\n<div>\n<label>Tok kuchi I: <span class=\"value\" id=\"iv\">4.00 A<\/span><\/label>\n<input id=\"I\" type=\"range\" min=\"0\" max=\"10\" step=\"0.01\" value=\"4\">\n<label>Induktivlik L: <span class=\"value\" id=\"lv\">0.50 H<\/span><\/label>\n<input id=\"L\" type=\"range\" min=\"0.01\" max=\"2\" step=\"0.01\" value=\"0.5\">\n<\/div>\n<div>\n<div class=\"result\">W = <span id=\"energy\">4.00<\/span> J<\/div>\n<p class=\"small\">I ikki marta oshsa, W to‘rt marta oshadi, chunki W ∝ I².<\/p>\n<\/div>\n<\/div>\n<h3>📈 W(I) grafigi<\/h3><canvas id=\"graph\"><\/canvas>\n<h3>🔋 Virtual tajriba<\/h3>\n<button onclick=\"startCircuit()\">▶ Boshlash<\/button><button onclick=\"stopCircuit()\">⏸ Pauza<\/button><button onclick=\"resetCircuit()\">↻ Qayta boshlash<\/button>\n<div class=\"coil\"><div class=\"field\" id=\"field2\"><\/div><div class=\"loop\"><\/div><\/div>\n<p id=\"circuitText\" class=\"small\">Kalit yopilganda tok va magnit maydon energiyasi ortadi.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"reja3\">\n<h2>3. G‘altakning induktivligi va o‘z-o‘zidan induksiya<\/h2>\n<p class=\"small\"><b>Induktivlik L<\/b> — g‘altakning tok o‘zgarishiga qarshilik ko‘rsatishi va magnit maydon energiyasini saqlash xususiyatini tavsiflaydi. Birligi — Genri (H).<\/p>\n<div class=\"formula\">ε = −L · ΔI/Δt<\/div>\n<p class=\"small\">Minus ishora Lens qoidasini bildiradi: tok ortishiga qarshi ta’sir paydo bo‘ladi; tok kamayganda esa kamayishga qarshi yo‘naladi.<\/p>\n<div class=\"grid\">\n<div class=\"card\">\n<h3>Kalit yopildi<\/h3><p class=\"small\">Tok ↑ → magnit maydon ↑ → W ↑ → induksion ta’sir tokning ortishiga qarshi.<\/p>\n<button onclick=\"induction('up')\">Tokni oshirish<\/button>\n<\/div>\n<div class=\"card\">\n<h3>Kalit ochildi<\/h3><p class=\"small\">Tok ↓ → magnit maydon ↓ → W ↓ → induksion ta’sir tokning kamayishiga qarshi.<\/p>\n<button onclick=\"induction('down')\">Tokni kamaytirish<\/button>\n<\/div>\n<\/div>\n<div class=\"result\" id=\"indResult\">Induksiya EYUK yo‘nalishini kuzating.<\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>🧮 Formula kalkulyatori<\/h2>\n<div class=\"grid\">\n<div><label>B (T)<\/label><input id=\"cb\" type=\"number\" value=\"1\"><\/div>\n<div><label>μ (H/m)<\/label><input id=\"cmu\" type=\"number\" value=\"0.000001256637\"><\/div>\n<div><label>L (H)<\/label><input id=\"cl\" type=\"number\" value=\"0.5\"><\/div>\n<div><label>I (A)<\/label><input id=\"ci\" type=\"number\" value=\"4\"><\/div>\n<div><label>V (m³)<\/label><input id=\"cv\" type=\"number\" value=\"0.05\"><\/div>\n<\/div>\n<button onclick=\"calculate()\">Hisoblash<\/button>\n<div class=\"result\" id=\"calc\">Natijalar shu yerda chiqadi.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"test\">\n<h2>📝 Test — bilimni tekshirish<\/h2>\n<div id=\"quiz\"><\/div>\n<button onclick=\"checkQuiz()\">Javoblarni tekshirish<\/button>\n<div class=\"result\" id=\"score\"><\/div>\n<\/section>\n\n<section class=\"card\">\n<h2>💡 Xulosa<\/h2>\n<p class=\"small\">Magnit maydon energiyaga ega. G‘altakda saqlanadigan magnit maydon energiyasi <b>W = LI²/2<\/b> formula orqali aniqlanadi. Magnit maydon energiya zichligi <b>w = B²/(2μ)<\/b> formula bilan ifodalanadi. G‘altakdagi tok o‘zgarganda o‘z-o‘zidan induksiya hodisasi yuz beradi va induksion EYUK tok o‘zgarishiga qarshi yo‘naladi.<\/p>\n<\/section>\n<\/div>\n<footer>11-sinf fizika • Magnit maydon energiyasi • Interaktiv HTML5 laboratoriya<\/footer>\n\n<script>\nconst $=id=>document.getElementById(id);\nfunction updateDensity(){\n let B=+$('B').value, mu=+$('MU').value, V=+$('V').value;\n let w=B*B/(2*mu), W=w*V;\n $('bv').textContent=B.toFixed(2)+' T'; $('muv').textContent=mu.toExponential(3)+' H/m'; $('vv').textContent=V.toFixed(3)+' m³';\n $('w').textContent=w.toFixed(2); $('wv').textContent=W.toFixed(2);\n $('wf').style.width=Math.min(100,w/1000000*100)+'%';\n document.querySelector('.field').style.opacity=.25+B/2;\n}\n['B','MU','V'].forEach(x=>$(x).addEventListener('input',updateDensity)); updateDensity();\n\nfunction updateEnergy(){\n let I=+$('I').value,L=+$('L').value,W=L*I*I/2;\n $('iv').textContent=I.toFixed(2)+' A'; $('lv').textContent=L.toFixed(2)+' H'; $('energy').textContent=W.toFixed(2);\n drawGraph(I,L);\n}\n['I','L'].forEach(x=>$(x).addEventListener('input',updateEnergy)); updateEnergy();\n\nfunction drawGraph(I,L){\n let c=$('graph'),ctx=c.getContext('2d'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;ctx.scale(d,d);\n ctx.clearRect(0,0,w,h);ctx.strokeStyle='#7188aa';ctx.beginPath();ctx.moveTo(45,15);ctx.lineTo(45,h-35);ctx.lineTo(w-15,h-35);ctx.stroke();\n ctx.strokeStyle='#5ed8ff';ctx.lineWidth=3;ctx.beginPath();\n for(let x=0;x<=w-65;x++){let cur=x/(w-65)*10,y=(h-45)-Math.min(h-60,(L*cur*cur/2)/(Math.max(1,L*50/2))*(h-60)); if(x===0)ctx.moveTo(45+x,y+5);else ctx.lineTo(45+x,y+5)}ctx.stroke();\n let px=45+I/10*(w-65),py=(h-45)-Math.min(h-60,(L*I*I/2)/(Math.max(1,L*50/2))*(h-60));\n ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py+5,6,0,Math.PI*2);ctx.fill();\n ctx.fillText('I (A)',w-45,h-12);ctx.fillText('W (J)',8,20);\n}\nlet timer=null;\nfunction startCircuit(){if(timer)return; $('circuitText').textContent='Tok oqmoqda: magnit maydon energiyasi to‘planmoqda.';timer=setInterval(()=>{let x=+$('I').value;if(x<10){$('I').value=Math.min(10,x+.1);updateEnergy()}else stopCircuit()},40)}\nfunction stopCircuit(){clearInterval(timer);timer=null;$('circuitText').textContent='Simulyatsiya pauzada.'}\nfunction resetCircuit(){stopCircuit();$('I').value=0;updateEnergy();$('circuitText').textContent='Kalit qayta ochildi.'}\nfunction induction(dir){\n $('indResult').innerHTML=dir==='up'?'⬆ Tok ortmoqda. <b>Induksion EYUK ortishga qarshi yo‘naladi.<\/b>':'⬇ Tok kamaymoqda. <b>Induksion EYUK kamayishga qarshi yo‘naladi.<\/b>';\n}\nfunction calculate(){\n let B=+$('cb').value,mu=+$('cmu').value,L=+$('cl').value,I=+$('ci').value,V=+$('cv').value;\n let w=B*B/(2*mu),W=L*I*I/2;\n $('calc').innerHTML=`w = ${w.toFixed(4)} J/m³<br>W = LI²/2 = ${W.toFixed(4)} J<br>W = wV = ${(w*V).toFixed(4)} J`;\n}\nconst qs=[\n['Magnit maydon energiya zichligi formulasi qaysi?',['w=B²/(2μ)','W=LI²/2','ε=−LΔI/Δt','F=BIL'],'0'],\n['G‘altakdagi magnit maydon energiyasi qaysi formula bilan topiladi?',['W=LI²/2','w=B²/(2μ)','I=U/R','P=UI'],'0'],\n['Induktivlik birligi nima?',['Genri','Tesla','Volt','Amper'],'0'],\n['Tok 2 marta oshsa W qanday o‘zgaradi?',['4 marta','2 marta','8 marta','O‘zgarmaydi'],'0'],\n['B ning o‘lchov birligi?',['Tesla','Genri','Joul','Om'],'0'],\n['O‘z-o‘zidan induksiya qachon yuz beradi?',['Tok o‘zgarganda','Tok o‘zgarmaganda','Faqat kuchlanish nol bo‘lganda','Faqat qarshilik katta bo‘lganda'],'0'],\n['ε = −LΔI/Δt dagi minus ishora nimani bildiradi?',['Lens qoidasini','Om qonunini','Nyuton qonunini','Joul-Lens qonunini'],'0'],\n['Energiya zichligining birligi?',['J/m³','J','T','H'],'0']\n];\nfunction makeQuiz(){ $('quiz').innerHTML=qs.map((q,i)=>`<div class=\"quiz\"><b>${i+1}. ${q[0]}<\/b>${q[1].map((o,j)=>`<label><input type=\"radio\" name=\"q${i}\" value=\"${j}\"> ${o}<\/label>`).join('')}<\/div>`).join('')}\nfunction checkQuiz(){let s=0;qs.forEach((q,i)=>{let a=document.querySelector(`input[name=q${i}]:checked`);if(a&&a.value===q[3])s++});$('score').textContent=`Natijangiz: ${s}/${qs.length}`}\nmakeQuiz();\n<\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>So‘nuvchi elektromagnit tebranishlar — 11-sinf fizika<\/title>\n<style>\n:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#5c677d;--blue:#2457d6;--cyan:#0e9aa7;--orange:#e88b25;--line:#dce4ef;--green:#17845b}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif}\nheader{background:linear-gradient(120deg,#152b68,#2457d6 65%,#0e9aa7);color:#fff;padding:30px 18px}\n.wrap{max-width:1120px;margin:auto}header h1{margin:0 0 8px;font-size:clamp(1.65rem,4vw,2.5rem);line-height:1.2}header p{margin:0;max-width:800px;color:#e8efff}\nnav{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}nav a{color:#fff;text-decoration:none;border:1px solid #ffffff70;border-radius:999px;padding:6px 12px;font-size:.9rem}\nmain{max-width:1120px;margin:22px auto;padding:0 14px 38px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 5px 18px #1b37610a;margin-bottom:16px}.wide{grid-column:1/-1}h2{font-size:1.35rem;margin:0 0 12px}h3{font-size:1.05rem;margin:14px 0 6px}.muted{color:var(--muted)}.formula{background:#edf3ff;border-left:4px solid var(--blue);padding:12px 14px;border-radius:8px;margin:10px 0;font-size:1.05rem;overflow-wrap:anywhere}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.control{background:#f8faff;border:1px solid var(--line);padding:12px;border-radius:10px}.control label{display:flex;justify-content:space-between;gap:8px;font-weight:650;font-size:.93rem}.control input{width:100%;margin-top:10px;accent-color:var(--blue)}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.btn{border:0;border-radius:9px;background:var(--blue);color:white;padding:10px 15px;font-weight:650;cursor:pointer}.btn.secondary{background:#e8eef8;color:#24324b}.btn.green{background:var(--green)}.readouts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:12px}.metric{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfcff}.metric span{display:block;color:var(--muted);font-size:.82rem}.metric strong{font-size:1.02rem;overflow-wrap:anywhere}canvas{width:100%;height:260px;display:block;border:1px solid var(--line);border-radius:10px;background:#fff}.smallcanvas{height:210px}.status{padding:10px 12px;border-radius:9px;background:#edf8f4;color:#175b43}.notice{background:#fff7e9;border-left:4px solid var(--orange);padding:12px;border-radius:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.quizq{padding:12px 0;border-bottom:1px solid var(--line)}.quizq:last-child{border:0}.quizq label{display:block;margin:5px 0}.result{font-weight:700;margin-top:12px}footer{text-align:center;color:var(--muted);padding:20px}\n@media(max-width:760px){.grid,.two{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.readouts{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:15px}canvas{height:230px}}\n<\/style>\n<\/head>\n<body>\n<header><div class=\"wrap\">\n<h1>Tebranishlarni grafik ravishda tasvirlash<\/h1>\n<p><b>11-sinf fizika.<\/b> So‘nuvchi elektromagnit tebranishlar — nazariya, interaktiv RLC laboratoriya, jonli grafiklar va bilimni tekshirish.<\/p>\n<nav><a href=\"#nazariya\">Nazariya<\/a><a href=\"#laboratoriya\">Virtual laboratoriya<\/a><a href=\"#grafiklar\">Grafiklar<\/a><a href=\"#topshiriqlar\">Topshiriqlar<\/a><a href=\"#test\">Test<\/a><\/nav>\n<\/div><\/header>\n<main>\n<section id=\"nazariya\" class=\"grid\">\n<article class=\"card\"><h2>1. So‘nuvchi elektromagnit tebranishlar<\/h2>\n<p>So‘nuvchi elektromagnit tebranishlarda kondensator zaryadi, tok kuchi va kuchlanish amplitudasi vaqt o‘tishi bilan kamayadi. Bunday jarayon qarshilikka ega RLC konturida kuzatiladi.<\/p>\n<h3>Jarayon qanday kechadi?<\/h3>\n<ol><li>Zaryadlangan kondensatorda elektr maydon energiyasi to‘planadi.<\/li><li>Kondensator razryadlanganda tok oqadi va g‘altakning magnit maydoni kuchayadi.<\/li><li>Elektr va magnit maydon energiyalari bir-biriga almashinadi.<\/li><li>Qarshilik energiyaning bir qismini issiqlikka aylantiradi, shu sababli amplituda kamayadi.<\/li><\/ol>\n<div class=\"formula\">q(t) = q₀ e<sup>−βt<\/sup> cos(ω<sub>d<\/sub>t + φ)<\/div>\n<p>Bu yerda q₀ — boshlang‘ich zaryad amplitudasi, β — so‘nish koeffitsiyenti, ω<sub>d<\/sub> — so‘nuvchi tebranishning burchak chastotasi, φ — boshlang‘ich faza.<\/p><\/article>\n<article class=\"card\"><h2>2. So‘nuvchi tebranishlarni tadqiq qilish<\/h2>\n<p>Virtual laboratoriyada sig‘im C, induktivlik L va qarshilik R ni o‘zgartirib, ularning zaryad va tok grafiklariga ta’sirini kuzating.<\/p>\n<h3>Asosiy formulalar<\/h3>\n<div class=\"formula\">T₀ = 2π√(LC)<\/div><div class=\"formula\">β = R/(2L)<\/div><div class=\"formula\">ω<sub>d<\/sub> = √(1/(LC) − β²)<\/div>\n<p>So‘nuvchi sinusoidal tebranish β² &lt; 1/(LC) үед sodir bo‘ladi. Qarshilik ortishi odatda so‘nishni tezlashtiradi; qarshilik juda katta bo‘lsa, kontur tebranmasdan muvozanatga qaytishi mumkin.<\/p>\n<div class=\"notice\"><b>Eslatma:<\/b> ideal konturda R = 0 deb olinadi va energiya yo‘qotilmaydi. Real konturda qarshilik sababli energiya kamayadi.<\/div><\/article>\n<article class=\"card wide\"><h2>3. Tebranishlarni grafik ravishda tasvirlash<\/h2>\n<p>Grafikning gorizontal o‘qi vaqtni, vertikal o‘qi esa zaryad, tok yoki kuchlanishni ko‘rsatadi. So‘nuvchi tebranishda sinusoidaning cho‘qqilari eksponensial qobiq ichida kichrayib boradi.<\/p>\n<div class=\"two\"><div><h3>Zaryad q(t)<\/h3><p class=\"muted\">Kondensator zaryadi musbat va manfiy qiymatlar orasida o‘zgaradi.<\/p><\/div><div><h3>Tok I(t)<\/h3><p class=\"muted\">Tok yo‘nalishi davriy almashinadi; uning amplitudasi ham so‘nadi.<\/p><\/div><\/div>\n<div class=\"formula\">I(t) = dq(t)/dt<\/div>\n<p class=\"muted\">Grafiklarda qiymatlar tanlangan parametrlar asosida sonli hisoblanadi. Tok grafigi zaryad funksiyasining hosilasidan olinadi.<\/p><\/article>\n<\/section>\n\n<section id=\"laboratoriya\" class=\"card\">\n<h2>Virtual laboratoriya: RLC konturi<\/h2>\n<p>Slayderlarni o‘zgartiring va “Boshlash” tugmasini bosing. Grafiklar va animatsiyadagi kondensator zaryadi bir vaqtda yangilanadi.<\/p>\n<div class=\"controls\">\n<div class=\"control\"><label for=\"cap\">Sig‘im C <span id=\"capVal\">100 µF<\/span><\/label><input id=\"cap\" type=\"range\" min=\"20\" max=\"300\" value=\"100\" step=\"10\"><\/div>\n<div class=\"control\"><label for=\"ind\">Induktivlik L <span id=\"indVal\">100 mH<\/span><\/label><input id=\"ind\" type=\"range\" min=\"20\" max=\"300\" value=\"100\" step=\"10\"><\/div>\n<div class=\"control\"><label for=\"res\">Qarshilik R <span id=\"resVal\">20 Ω<\/span><\/label><input id=\"res\" type=\"range\" min=\"0\" max=\"100\" value=\"20\" step=\"2\"><\/div>\n<\/div>\n<div class=\"buttons\"><button class=\"btn\" id=\"start\">▶ Boshlash<\/button><button class=\"btn secondary\" id=\"pause\">Ⅱ To‘xtatish<\/button><button class=\"btn secondary\" id=\"reset\">↻ Qayta boshlash<\/button><button class=\"btn green\" id=\"ideal\">Ideal holat (R=0)<\/button><\/div>\n<div class=\"readouts\">\n<div class=\"metric\"><span>Ideal davr T₀<\/span><strong id=\"period\">—<\/strong><\/div>\n<div class=\"metric\"><span>So‘nish koeffitsiyenti β<\/span><strong id=\"beta\">—<\/strong><\/div>\n<div class=\"metric\"><span>So‘nuvchi chastota ωd<\/span><strong id=\"omega\">—<\/strong><\/div>\n<div class=\"metric\"><span>Rejim<\/span><strong id=\"regime\">—<\/strong><\/div>\n<\/div>\n<div class=\"two\" style=\"margin-top:16px\">\n<div><h3>RLC kontur animatsiyasi<\/h3><canvas id=\"circuit\" class=\"smallcanvas\" aria-label=\"RLC konturi animatsiyasi\"><\/canvas><p class=\"muted\">Kondensator rangi va to‘ldirilishi zaryadning ishorasi va miqdorini ifodalaydi.<\/p><\/div>\n<div><h3>Zaryadning vaqt grafigi<\/h3><canvas id=\"charge\" aria-label=\"Zaryadning vaqt bo‘yicha grafigi\"><\/canvas><\/div>\n<\/div>\n<div style=\"margin-top:14px\"><h3>Tok kuchining vaqt grafigi<\/h3><canvas id=\"current\" aria-label=\"Tok kuchining vaqt bo‘yicha grafigi\"><\/canvas><\/div>\n<p id=\"status\" class=\"status\" aria-live=\"polite\">Tayyor. Parametrlarni tanlang va simulyatsiyani boshlang.<\/p>\n<\/section>\n\n<section id=\"grafiklar\" class=\"card\">\n<h2>Grafikni qanday tahlil qilamiz?<\/h2>\n<ul><li><b>Amplituda:<\/b> ketma-ket cho‘qqilarning balandligi vaqt o‘tishi bilan kamayadi.<\/li><li><b>Davr:<\/b> bir xil holatning ketma-ket ikki marta takrorlanishigacha bo‘lgan vaqt.<\/li><li><b>So‘nish:<\/b> qarshilik ortganda tebranish energiyasi tezroq yo‘qoladi.<\/li><li><b>Aperiodik rejim:<\/b> tebranish yuz bermaydi; zaryad muvozanat qiymatiga tebranmasdan qaytadi.<\/li><\/ul>\n<div class=\"notice\">Tajriba taklifi: avval R = 0 holatini kuzating, so‘ng R ni 20 Ω, 50 Ω va 100 Ω ga o‘zgartiring. Grafik amplitudasi qanday o‘zgarishini taqqoslang.<\/div>\n<\/section>\n\n<section id=\"topshiriqlar\" class=\"card\">\n<h2>Mustaqil topshiriqlar<\/h2>\n<ol><li>R = 0 bo‘lganda grafik qanday ko‘rinadi? Nima uchun?<\/li><li>Qarshilikni oshirsangiz, amplituda qanchalik tez kamayadi?<\/li><li>Induktivlik L ortganda ideal tebranish davri qanday o‘zgaradi?<\/li><li>Grafikdan tebranish davrini aniqlash uchun qaysi ikki nuqtani tanlash kerak?<\/li><li>Real konturda energiya nima sababdan kamayadi?<\/li><\/ol>\n<\/section>\n\n<section id=\"test\" class=\"card\">\n<h2>Bilimni tekshirish — 5 ta test<\/h2>\n<form id=\"quiz\">\n<div class=\"quizq\"><b>1. So‘nuvchi elektromagnit tebranishlarda amplituda nima qiladi?<\/b>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Doimiy qoladi<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Vaqt o‘tishi bilan kamayadi<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Cheksiz ortadi<\/label><\/div>\n<div class=\"quizq\"><b>2. RLC konturida energiya yo‘qotilishining asosiy sababi nima?<\/b>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> Elektr qarshilik<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> Kondensator sig‘imi<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> Vaqt o‘qi<\/label><\/div>\n<div class=\"quizq\"><b>3. Ideal LC konturining davri qaysi formula bilan topiladi?<\/b>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> T = R/L<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> T = 2π√(LC)<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> T = LC<\/label><\/div>\n<div class=\"quizq\"><b>4. Zaryad grafigining gorizontal o‘qi nimani bildiradi?<\/b>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> Qarshilikni<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> Vaqtni<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> Induktivlikni<\/label><\/div>\n<div class=\"quizq\"><b>5. Qarshilik yetarlicha katta bo‘lsa, qanday holat yuz berishi mumkin?<\/b>\n<label><input type=\"radio\" name=\"q5\" value=\"a\"> Amplituda cheksiz ortadi<\/label><label><input type=\"radio\" name=\"q5\" value=\"b\"> Tebranish chastotasi cheksiz bo‘ladi<\/label><label><input type=\"radio\" name=\"q5\" value=\"c\"> Aperiodik, tebranmasdan qaytish<\/label><\/div>\n<button class=\"btn\" type=\"submit\">Javoblarni tekshirish<\/button><button class=\"btn secondary\" type=\"button\" id=\"clearQuiz\">Qayta ishlash<\/button>\n<div id=\"result\" class=\"result\" aria-live=\"polite\"><\/div>\n<\/form>\n<\/section>\n<footer>11-sinf fizika • So‘nuvchi elektromagnit tebranishlar • Interaktiv o‘quv materiali<\/footer>\n<\/main>\n<script>\n(() => {\nconst $ = id => document.getElementById(id);\nconst cap=$('cap'), ind=$('ind'), res=$('res');\nlet running=false, elapsed=0, lastStamp=null, raf=null;\nconst q0=1, phi=0;\nfunction params(){\n const C=Number(cap.value)*1e-6, L=Number(ind.value)*1e-3, R=Number(res.value);\n const beta=R/(2*L), w0=1/Math.sqrt(L*C), disc=w0*w0-beta*beta;\n return {C,L,R,beta,w0,disc,wd:disc>0?Math.sqrt(disc):0,T0:2*Math.PI/w0};\n}\nfunction updateLabels(){\n $('capVal').textContent=cap.value+' µF'; $('indVal').textContent=ind.value+' mH'; $('resVal').textContent=res.value+' Ω';\n const p=params();\n $('period').textContent=(p.T0*1000).toFixed(2)+' ms';\n $('beta').textContent=p.beta.toFixed(2)+' s⁻¹';\n $('omega').textContent=p.disc>0?p.wd.toFixed(1)+' rad/s':'tebranma yo‘q';\n $('regime').textContent=p.disc>0?'Tebranma':Math.abs(p.disc)<1e-8?'Chegaraviy':'Aperiodik';\n $('status').textContent=p.disc>0?'Tebranma rejimi: zaryad va tok sinusoidal ko‘rinishda so‘nadi.': 'Aperiodik yoki chegaraviy rejim: sinusoidal tebranish kuzatilmaydi.';\n drawAll();\n}\nfunction qAt(t,p=params()){\n if(p.disc>0) return q0*Math.exp(-p.beta*t)*Math.cos(p.wd*t+phi);\n // Critically damped / overdamped solution with q(0)=1 and q'(0)=0\n if(Math.abs(p.disc)<1e-8) return q0*(1+p.beta*t)*Math.exp(-p.beta*t);\n const s=Math.sqrt(-p.disc), r1=-p.beta+s, r2=-p.beta-s;\n const A=-r2/(r1-r2), B=r1/(r1-r2);\n return q0*(A*Math.exp(r1*t)+B*Math.exp(r2*t));\n}\nfunction iAt(t,p=params()){\n const h=1e-6;\n return (qAt(t+h,p)-qAt(Math.max(0,t-h),p))/(t===0?h:2*h);\n}\nfunction canvasSetup(c){\n const dpr=window.devicePixelRatio||1, rect=c.getBoundingClientRect();\n c.width=Math.max(300,Math.round(rect.width*dpr)); c.height=Math.round((c.classList.contains('smallcanvas')?210:260)*dpr);\n const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);\n return {ctx,w:rect.width,h:c.height/dpr};\n}\nfunction plot(canvasId, fn, label, color, tMax, envelope=false){\n const c=$(canvasId), {ctx,w,h}=canvasSetup(c); ctx.clearRect(0,0,w,h);\n const pad={l:48,r:12,t:18,b:34}, pw=w-pad.l-pad.r, ph=h-pad.t-pad.b;\n ctx.strokeStyle='#e5eaf2';ctx.lineWidth=1;\n for(let k=0;k<=4;k++){let y=pad.t+ph*k/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();}\n ctx.strokeStyle='#8b98ac';ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,h-pad.b);ctx.lineTo(w-pad.r,h-pad.b);ctx.stroke();\n ctx.fillStyle='#526078';ctx.font='12px system-ui';ctx.fillText(label,7,14);ctx.fillText('0',pad.l-15,h-pad.b+4);ctx.fillText(tMax.toFixed(3)+' s',w-pad.r-42,h-8);ctx.fillText('t (s)',w/2,h-8);\n const points=500; let vals=[];\n for(let n=0;n<=points;n++) vals.push(fn(tMax*n/points));\n let max=Math.max(...vals.map(Math.abs),.000001); \n const scale=max*1.18;\n ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();\n vals.forEach((v,n)=>{let x=pad.l+pw*n/points,y=pad.t+ph/2-(v/scale)*(ph/2);if(n===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();\n if(envelope && params().disc>0){\n   const p=params();ctx.setLineDash([5,4]);ctx.strokeStyle='#e88b25';ctx.lineWidth=1.5;\n   [1,-1].forEach(sign=>{ctx.beginPath();for(let n=0;n<=points;n++){let t=tMax*n/points,v=sign*Math.exp(-p.beta*t),x=pad.l+pw*n/points,y=pad.t+ph/2-v*(ph/2);if(n===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();});\n   ctx.setLineDash([]);\n }\n ctx.fillStyle='#526078';ctx.fillText('+'+scale.toExponential(1),3,pad.t+9);ctx.fillText('−'+scale.toExponential(1),1,h-pad.b-2);\n}\nfunction drawCircuit(){\n const c=$('circuit'),{ctx,w,h}=canvasSetup(c);ctx.clearRect(0,0,w,h);\n const p=params(), q=qAt(elapsed,p), mid=h/2;\n ctx.lineWidth=3;ctx.strokeStyle='#65748b';ctx.beginPath();ctx.moveTo(35,mid-42);ctx.lineTo(w-35,mid-42);ctx.lineTo(w-35,mid+42);ctx.lineTo(35,mid+42);ctx.lineTo(35,mid-42);ctx.stroke();\n // resistor zigzag at top right\n ctx.strokeStyle='#e88b25';ctx.beginPath();ctx.moveTo(w*.55,mid-42);\n for(let j=0;j<7;j++)ctx.lineTo(w*.55+(j+1)*7,mid-42+(j%2?9:-9));\n ctx.stroke();ctx.fillStyle='#172033';ctx.font='12px system-ui';ctx.fillText('R = '+p.R+' Ω',w*.53,mid-58);\n // coil bottom\n ctx.strokeStyle='#2457d6';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(w*.38,mid+42);\n for(let j=0;j<5;j++)ctx.arc(w*.38+j*14+7,mid+42,7,Math.PI,0,false);\n ctx.lineTo(w*.38+70,mid+42);ctx.stroke();ctx.fillStyle='#172033';ctx.fillText('L',w*.38+25,mid+68);\n // capacitor plates on left\n ctx.strokeStyle='#0e9aa7';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(22,mid-15);ctx.lineTo(48,mid-15);ctx.moveTo(22,mid+15);ctx.lineTo(48,mid+15);ctx.stroke();\n ctx.fillStyle='#172033';ctx.font='12px system-ui';ctx.fillText('C',55,mid+4);\n // charge fill indicator\n ctx.fillStyle=q>=0?'#2457d6':'#e88b25';ctx.globalAlpha=.85;\n const height=Math.max(3,Math.abs(q)*27);ctx.fillRect(70,mid+35-height,12,height);ctx.globalAlpha=1;\n ctx.fillStyle='#172033';ctx.fillText('q/q₀ = '+q.toFixed(2),90,mid+4);\n // animated current dots around circuit for underdamped mode\n if(p.disc>0){let phase=(elapsed*p.wd*4)%(2*Math.PI);for(let j=0;j<5;j++){let f=((phase/(2*Math.PI)+j/5)%1),x,y;if(f<.25){x=35+(w-70)*f*4;y=mid-42;}else if(f<.5){x=w-35;y=mid-42+(f-.25)*4*84;}else if(f<.75){x=w-35-(w-70)*(f-.5)*4;y=mid+42;}else{x=35;y=mid+42-(f-.75)*4*84;}ctx.fillStyle='#0e9aa7';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();}}\n}\nfunction drawAll(){\n const p=params(), tMax=Math.max(.01,Math.min(.08,Math.max(p.T0*5,elapsed+.002)));\n plot('charge',t=>qAt(t,p),'q / q₀','#2457d6',tMax,true);\n plot('current',t=>iAt(t,p),'I (nisbiy birlik)','#0e9aa7',tMax,false);\n drawCircuit();\n}\nfunction tick(stamp){\n if(!running)return;\n if(lastStamp!==null)elapsed+=Math.min((stamp-lastStamp)/1000,.05);lastStamp=stamp;\n drawAll();raf=requestAnimationFrame(tick);\n}\nfunction start(){if(running)return;running=true;lastStamp=null;$('status').textContent='Simulyatsiya ishlayapti. Parametrlarni o‘zgartirib natijalarni kuzating.';raf=requestAnimationFrame(tick);}\nfunction pause(){running=false;if(raf)cancelAnimationFrame(raf);lastStamp=null;$('status').textContent='Simulyatsiya to‘xtatildi.';}\nfunction reset(){pause();elapsed=0;drawAll();$('status').textContent='Boshlang‘ich holat tiklandi.';}\n[cap,ind,res].forEach(el=>el.addEventListener('input',()=>{updateLabels();}));\n$('start').addEventListener('click',start);$('pause').addEventListener('click',pause);$('reset').addEventListener('click',reset);\n$('ideal').addEventListener('click',()=>{res.value=0;updateLabels();reset();});\n$('quiz').addEventListener('submit',e=>{e.preventDefault();const ans={q1:'b',q2:'a',q3:'b',q4:'b',q5:'c'};let score=0;for(const [k,v] of Object.entries(ans)){const chosen=document.querySelector('input[name=\"'+k+'\"]:checked');if(chosen&&chosen.value===v)score++;} $('result').textContent=`Natija: ${score}/5 (${score*20}%). `+(score===5?'A’lo! Barcha javoblar to‘g‘ri.':score>=3?'Yaxshi! Xatolarni ko‘rib, mavzuni takrorlang.':'Nazariyani qayta o‘qib, yana urinib ko‘ring.');});\n$('clearQuiz').addEventListener('click',()=>{$('quiz').reset();$('result').textContent='';});\nwindow.addEventListener('resize',drawAll);\nupdateLabels();\n})();\n<\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>O‘zgaruvchan tok zanjiridagi aktiv qarshilik — 11-sinf fizika<\/title>\n<style>\n:root{--bg:#f3f6fb;--card:#fff;--ink:#17243a;--muted:#5b6b82;--blue:#2463eb;--teal:#0e9f8a;--orange:#ef8b22;--line:#dce5f0}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.55}\nheader{background:linear-gradient(120deg,#102a56,#2463eb);color:white;padding:28px 18px 32px}\n.wrap{max-width:1100px;margin:auto;padding:0 16px}header h1{margin:0 0 8px;font-size:clamp(1.6rem,4vw,2.5rem);line-height:1.15}header p{margin:0;max-width:780px;color:#e1eaff}\n.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.pill{border:1px solid #ffffff55;border-radius:999px;padding:5px 11px;font-size:.88rem}\nnav{position:sticky;top:0;z-index:5;background:#ffffffed;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}\n.navinner{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:1100px;margin:auto}\nnav a{white-space:nowrap;text-decoration:none;color:#1d3d71;padding:8px 12px;border-radius:10px;font-weight:650;font-size:.9rem}nav a:hover{background:#e8efff}\nmain{padding:24px 0 50px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,25px);margin:0 0 18px;box-shadow:0 6px 24px #19345c08}\nh2{margin:0 0 12px;font-size:1.45rem;color:#173a75}h3{margin:16px 0 7px;font-size:1.05rem}p{margin:8px 0}.muted{color:var(--muted)}.formula{font-family:Cambria,Georgia,serif;font-size:1.22rem;background:#f0f5ff;border-left:4px solid var(--blue);padding:10px 14px;border-radius:8px;margin:9px 0;overflow-x:auto}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}.mini{background:#f8faff;border:1px solid var(--line);padding:14px;border-radius:13px}\nlabel{display:block;font-weight:650;margin:10px 0 5px}input[type=range]{width:100%;accent-color:var(--blue)}input[type=number]{width:100%;padding:9px;border:1px solid #cbd7e7;border-radius:9px;font:inherit}\nbutton{border:0;border-radius:10px;padding:9px 14px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#e8efff;color:#214b9c}button:hover{filter:brightness(.96)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}\n.metric{font-size:1.45rem;font-weight:800;color:#153c82}.metric small{font-size:.78rem;font-weight:600;color:var(--muted)}\ncanvas{display:block;width:100%;height:270px;background:#fff;border:1px solid var(--line);border-radius:12px}\n.circuit{min-height:205px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f7fbff,#eaf2ff);border-radius:14px;border:1px solid var(--line);padding:12px}\n.resistor{width:82px;height:30px;border:3px solid #d97706;background:#fff2d7;display:flex;align-items:center;justify-content:center;border-radius:5px;font-weight:800;color:#92400e;box-shadow:0 0 18px #f59e0b35}\n.wire{height:4px;background:#58759e;min-width:35px}.battery{height:50px;width:15px;border-left:4px solid #2463eb;border-right:2px solid #2463eb;position:relative}.battery:after{content:\"\";position:absolute;left:-7px;right:-7px;top:22px;border-top:3px solid #2463eb}\n.flow{color:var(--teal);font-size:1.2rem;font-weight:900;animation:move 1s linear infinite}@keyframes move{50%{transform:translateX(5px);opacity:.5}}\n.note{padding:12px 14px;background:#fff8e9;border-left:4px solid var(--orange);border-radius:8px}.success{color:#087d6c;font-weight:700}\n.quizq{padding:13px 0;border-bottom:1px solid var(--line)}.quizq label{font-weight:500;display:flex;gap:8px;align-items:flex-start}.quizq input{margin-top:6px}\nfooter{text-align:center;padding:20px;color:var(--muted);font-size:.9rem}\n@media(max-width:600px){canvas{height:230px}.circuit{min-height:160px}.resistor{width:64px}.wire{min-width:17px}}\n<\/style>\n<\/head>\n<body>\n<header><div class=\"wrap\">\n<h1>O‘zgaruvchan tok zanjiridagi aktiv qarshilik<\/h1>\n<p>11-sinf fizika fani uchun nazariya, interaktiv simulyatsiyalar, animatsion grafiklar va bilimni tekshirish topshiriqlari.<\/p>\n<div class=\"pills\"><span class=\"pill\">3 ta o‘quv rejasi<\/span><span class=\"pill\">Interaktiv tajribalar<\/span><span class=\"pill\">Telefon va kompyuterga mos<\/span><\/div>\n<\/div><\/header>\n<nav><div class=\"navinner\">\n<a href=\"#reja1\">1. Aktiv qarshilik<\/a><a href=\"#reja2\">2. Faza va grafiklar<\/a><a href=\"#reja3\">3. Om qonuni va quvvat<\/a><a href=\"#test\">Test<\/a>\n<\/div><\/nav>\n<main class=\"wrap\">\n<section class=\"card\" id=\"reja1\">\n<h2>1. Aktiv qarshilik va uning fizik mohiyati<\/h2>\n<p><b>Aktiv qarshilik<\/b> — elektr energiyasini asosan issiqlik energiyasiga aylantiradigan qarshilik. Rezistor, elektr isitkich va cho‘g‘lanma lampaning tolasi bunga misol bo‘ladi. O‘zgaruvchan tokda tok kuchi ham, kuchlanish ham vaqt davomida davriy o‘zgaradi.<\/p>\n<div class=\"grid\">\n<div class=\"mini\"><h3>Asosiy tushunchalar<\/h3><p><b>R<\/b> — qarshilik, om (Ω)<\/p><p><b>u, i<\/b> — oniy kuchlanish va tok<\/p><p><b>U, I<\/b> — effektiv kuchlanish va tok<\/p><p><b>f<\/b> — chastota, Hz<\/p><\/div>\n<div class=\"mini\"><h3>Formulalar<\/h3><div class=\"formula\">i = u / R<\/div><div class=\"formula\">u = U<sub>m<\/sub> sin(ωt)<\/div><div class=\"formula\">i = I<sub>m<\/sub> sin(ωt)<\/div><\/div>\n<\/div>\n<h3>Interaktiv zanjir modeli<\/h3>\n<div class=\"circuit\" aria-label=\"O‘zgaruvchan tok manbai va rezistor tasviri\">\n<div style=\"display:flex;align-items:center;gap:8px;flex-wrap:nowrap\">\n<div style=\"text-align:center;font-size:.8rem\"><div class=\"battery\"><\/div>AC manba<\/div><div class=\"wire\"><\/div><span class=\"flow\">➜<\/span><div class=\"resistor\" id=\"resistorVisual\">R = 50 Ω<\/div><div class=\"wire\"><\/div><span class=\"flow\">➜<\/span>\n<\/div><\/div>\n<div class=\"grid\">\n<div class=\"mini\"><label for=\"r1\">Qarshilik R: <span id=\"r1label\">50<\/span> Ω<\/label><input id=\"r1\" type=\"range\" min=\"10\" max=\"200\" step=\"5\" value=\"50\">\n<label for=\"u1\">Kuchlanish U: <span id=\"u1label\">100<\/span> V<\/label><input id=\"u1\" type=\"range\" min=\"10\" max=\"240\" step=\"10\" value=\"100\">\n<\/div>\n<div class=\"mini\"><p class=\"muted\">Effektiv qiymatlar bo‘yicha hisob<\/p><div class=\"metric\"><span id=\"i1\">2.00<\/span> A <small>— tok kuchi<\/small><\/div><div class=\"metric\"><span id=\"p1\">200<\/span> W <small>— aktiv quvvat<\/small><\/div><p id=\"heatText\">Qarshilikda issiqlik ajraladi.<\/p><\/div>\n<\/div>\n<p class=\"note\">Kuchlanish o‘zgarmas bo‘lganda qarshilik ortsa, Om qonuniga ko‘ra tok kuchi kamayadi.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"reja2\">\n<h2>2. Tok kuchi, kuchlanish va fazaviy munosabat<\/h2>\n<p>Aktiv qarshilikli zanjirda tok va kuchlanish <b>bir xil fazada<\/b> o‘zgaradi. Ularning maksimum, minimum va noldan o‘tish nuqtalari bir vaqtda sodir bo‘ladi.<\/p>\n<div class=\"formula\">u = U<sub>m<\/sub> sin(ωt), &nbsp; i = I<sub>m<\/sub> sin(ωt)<\/div>\n<div class=\"formula\">φ = 0° &nbsp;&nbsp; va &nbsp;&nbsp; ω = 2πf<\/div>\n<div class=\"grid\">\n<div class=\"mini\"><label for=\"freq\">Chastota f: <span id=\"freqlabel\">1.0<\/span> Hz<\/label><input id=\"freq\" type=\"range\" min=\"0.5\" max=\"3\" step=\"0.5\" value=\"1\">\n<label for=\"amp\">Grafik amplitudasi: <span id=\"amplabel\">1.0<\/span><\/label><input id=\"amp\" type=\"range\" min=\"0.5\" max=\"1.5\" step=\"0.1\" value=\"1\">\n<div class=\"controls\"><button id=\"play\">▶ Boshlash<\/button><button class=\"secondary\" id=\"pause\">Ⅱ To‘xtatish<\/button><button class=\"secondary\" id=\"reset\">↺ Qayta boshlash<\/button><\/div>\n<p class=\"muted\">Ko‘k chiziq — kuchlanish; yashil chiziq — tok kuchi. Grafiklar tushunishni osonlashtirish uchun normallashtirilgan.<\/p>\n<\/div>\n<div class=\"mini\"><canvas id=\"wave\" width=\"800\" height=\"300\" aria-label=\"Tok va kuchlanish sinusoidal grafigi\"><\/canvas><p class=\"success\">Fazalar farqi: φ = 0°<\/p><\/div>\n<\/div>\n<h3>Grafikni kuzatish<\/h3><p>Chastota oshirilsa, tebranishlar bir sekund ichida ko‘proq takrorlanadi. Aktiv qarshilikda ikkala grafikning fazasi baribir mosligicha qoladi.<\/p>\n<\/section>\n\n<section class=\"card\" id=\"reja3\">\n<h2>3. Aktiv qarshilikda Om qonuni va quvvat<\/h2>\n<p>O‘zgaruvchan tok zanjiridagi aktiv qarshilik uchun Om qonuni tok va kuchlanishning effektiv qiymatlari orqali yoziladi.<\/p>\n<div class=\"grid\">\n<div class=\"mini\"><div class=\"formula\">I = U / R<\/div><div class=\"formula\">P = UI<\/div><div class=\"formula\">P = I²R = U²/R<\/div><\/div>\n<div class=\"mini\"><p><b>Quvvat<\/b> — elektr energiyasining vaqt birligida aylanish tezligini ifodalaydi.<\/p><p>Aktiv qarshilikda quvvat koeffitsiyenti cos φ = 1, chunki φ = 0°.<\/p><p class=\"muted\">Quvvat birligi — vatt (W).<\/p><\/div>\n<\/div>\n<h3>Hisoblash laboratoriyasi<\/h3>\n<div class=\"grid\">\n<div class=\"mini\"><label for=\"u3\">Kuchlanish U (V)<\/label><input type=\"number\" id=\"u3\" min=\"1\" max=\"240\" value=\"220\"><label for=\"r3\">Qarshilik R (Ω)<\/label><input type=\"number\" id=\"r3\" min=\"1\" max=\"10000\" value=\"110\"><button id=\"calc\" style=\"margin-top:12px\">Hisoblash<\/button><\/div>\n<div class=\"mini\"><p>Tok kuchi I = U/R<\/p><div class=\"metric\" id=\"outI\">2.00 A<\/div><p>Aktiv quvvat P = UI<\/p><div class=\"metric\" id=\"outP\">440 W<\/div><p id=\"calcExplain\" class=\"muted\">220 V / 110 Ω = 2 A<\/p><\/div>\n<\/div>\n<div class=\"note\"><b>Namuna:<\/b> U = 220 V va R = 110 Ω bo‘lsa, I = 220/110 = 2 A. Quvvat P = 220 × 2 = 440 W.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"test\">\n<h2>Bilimni tekshirish<\/h2>\n<p>Har bir savol uchun bitta javobni belgilang, so‘ng natijani tekshiring.<\/p>\n<form id=\"quiz\">\n<div class=\"quizq\"><b>1. Aktiv qarshilik elektr energiyasini asosan nimaga aylantiradi?<\/b>\n<label><input type=\"radio\" name=\"q1\" value=\"a\"> Mexanik energiyaga<\/label><label><input type=\"radio\" name=\"q1\" value=\"b\"> Issiqlik energiyasiga<\/label><label><input type=\"radio\" name=\"q1\" value=\"c\"> Yadro energiyasiga<\/label><\/div>\n<div class=\"quizq\"><b>2. Aktiv qarshilikli zanjirda tok va kuchlanish orasidagi fazalar farqi qancha?<\/b>\n<label><input type=\"radio\" name=\"q2\" value=\"a\"> 90°<\/label><label><input type=\"radio\" name=\"q2\" value=\"b\"> 180°<\/label><label><input type=\"radio\" name=\"q2\" value=\"c\"> 0°<\/label><\/div>\n<div class=\"quizq\"><b>3. U = 12 V va R = 6 Ω bo‘lsa, tok kuchi qancha?<\/b>\n<label><input type=\"radio\" name=\"q3\" value=\"a\"> 2 A<\/label><label><input type=\"radio\" name=\"q3\" value=\"b\"> 18 A<\/label><label><input type=\"radio\" name=\"q3\" value=\"c\"> 0,5 A<\/label><\/div>\n<div class=\"quizq\"><b>4. Aktiv quvvatning formulasi qaysi?<\/b>\n<label><input type=\"radio\" name=\"q4\" value=\"a\"> P = U + I<\/label><label><input type=\"radio\" name=\"q4\" value=\"b\"> P = UI<\/label><label><input type=\"radio\" name=\"q4\" value=\"c\"> P = U/R<\/label><\/div>\n<div class=\"controls\"><button type=\"submit\">Javoblarni tekshirish<\/button><button class=\"secondary\" type=\"reset\">Tozalash<\/button><\/div>\n<div id=\"quizResult\" aria-live=\"polite\"><\/div>\n<\/form>\n<\/section>\n<section class=\"card\"><h2>Xulosa<\/h2><ul>\n<li>Aktiv qarshilik elektr energiyasini asosan issiqlikka aylantiradi.<\/li>\n<li>Aktiv qarshilikda tok kuchi va kuchlanish bir xil fazada bo‘ladi.<\/li>\n<li>Effektiv qiymatlar uchun Om qonuni: I = U/R.<\/li>\n<li>Aktiv quvvat: P = UI = I²R = U²/R.<\/li>\n<\/ul><p><b>Mustaqil topshiriq:<\/b> U = 120 V va R = 60 Ω bo‘lgan zanjirda tok kuchi va quvvatni hisoblang.<\/p><\/section>\n<\/main>\n<footer>11-sinf fizika • O‘quv simulyatsiyasi • Barcha hisob-kitoblar brauzerda bajariladi<\/footer>\n<script>\nconst $=id=>document.getElementById(id);\nfunction updateCircuit(){\n const R=+$('r1').value,U=+$('u1').value,I=U/R,P=U*I;\n $('r1label').textContent=R;$('u1label').textContent=U;$('i1').textContent=I.toFixed(2);$('p1').textContent=P.toFixed(1);\n $('resistorVisual').textContent='R = '+R+' Ω';\n $('resistorVisual').style.boxShadow='0 0 '+Math.min(35,5+P/15)+'px rgba(245,158,11,.55)';\n $('heatText').textContent='Aktiv quvvat '+P.toFixed(1)+' W: quvvat kattalashgan sari vaqt birligida ko‘proq energiya issiqlikka aylanadi.';\n}\n$('r1').addEventListener('input',updateCircuit);$('u1').addEventListener('input',updateCircuit);updateCircuit();\nconst canvas=$('wave'),ctx=canvas.getContext('2d');let running=true,phase=0,last=0;\nfunction drawWave(){\n const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);\n ctx.strokeStyle='#e2e9f3';ctx.lineWidth=1;\n for(let x=0;x<=w;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}\n for(let y=0;y<=h;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}\n const mid=h/2,amp=+$('amp').value*75,cycles=+$('freq').value;\n ctx.strokeStyle='#2463eb';ctx.lineWidth=3;ctx.beginPath();\n for(let x=0;x<=w;x++){const y=mid-amp*Math.sin((x/w*cycles*2*Math.PI)+phase);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();\n ctx.strokeStyle='#0e9f8a';ctx.lineWidth=3;ctx.beginPath();\n for(let x=0;x<=w;x++){const y=mid-(amp*.72)*Math.sin((x/w*cycles*2*Math.PI)+phase);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();\n ctx.fillStyle='#2463eb';ctx.font='bold 18px sans-serif';ctx.fillText('u(t)',14,23);\n ctx.fillStyle='#0e9f8a';ctx.fillText('i(t)',70,23);\n}\nfunction animate(ts){if(running&&last){phase+=(ts-last)*0.0015*+$('freq').value;if(phase>Math.PI*2)phase-=Math.PI*2}last=ts;drawWave();requestAnimationFrame(animate)}\n$('freq').addEventListener('input',()=>{$('freqlabel').textContent=(+$('freq').value).toFixed(1)});\n$('amp').addEventListener('input',()=>{$('amplabel').textContent=(+$('amp').value).toFixed(1)});\n$('play').onclick=()=>{running=true};$('pause').onclick=()=>{running=false};$('reset').onclick=()=>{phase=0;running=true};\nrequestAnimationFrame(animate);\nfunction calculate(){\n let U=Number($('u3').value),R=Number($('r3').value);\n if(!Number.isFinite(U)||!Number.isFinite(R)||U<=0||R<=0){$('outI').textContent='Qiymatlarni tekshiring';$('outP').textContent='—';$('calcExplain').textContent='Kuchlanish va qarshilik musbat son bo‘lishi kerak.';return}\n let I=U/R,P=U*I;\n $('outI').textContent=I.toFixed(3)+' A';$('outP').textContent=P.toFixed(2)+' W';\n $('calcExplain').textContent=U+' V / '+R+' Ω = '+I.toFixed(3)+' A; P = '+U+' × '+I.toFixed(3)+' = '+P.toFixed(2)+' W';\n}\n$('calc').onclick=calculate;$('u3').addEventListener('input',calculate);$('r3').addEventListener('input',calculate);\n$('quiz').addEventListener('submit',e=>{e.preventDefault();const answers={q1:'b',q2:'c',q3:'a',q4:'b'};let score=0;for(const [q,a] of Object.entries(answers)){const chosen=document.querySelector('input[name=\"'+q+'\"]:checked');if(chosen&&chosen.value===a)score++}\n$('quizResult').innerHTML='<h3>Natija: '+score+'/4<\/h3><p>'+(score===4?'Ajoyib! Barcha javoblar to‘g‘ri.':score>=2?'Yaxshi urinish. Formulalarni yana bir bor takrorlang.':'Nazariy ma’lumotlarni qayta o‘qib, yana urinib ko‘ring.')+'<\/p><p class=\"muted\">To‘g‘ri javoblar: 1-B, 2-C, 3-A, 4-B.<\/p>'});\n$('quiz').addEventListener('reset',()=>setTimeout(()=>$('quizResult').innerHTML='',0));\n<\/script>\n<\/body>\n<\/html>", "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>11-sinf fizika — O‘zgaruvchan tok zanjiridagi kondensator<\/title>\n<style>\n:root{--bg:#f3f6fb;--card:#fff;--ink:#17243a;--muted:#5b6b82;--blue:#2463eb;--red:#e5484d;--teal:#0f9d91;--line:#dce4ef}\n*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Arial,sans-serif}\nheader{padding:34px 20px;background:linear-gradient(130deg,#102a56,#2463eb);color:#fff}\n.wrap{max-width:1100px;margin:auto;padding:0 18px}header h1{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.2;margin:8px 0}header p{max-width:780px;color:#e6eeff;margin-bottom:0}\n.tag{display:inline-block;padding:4px 10px;border:1px solid #ffffff66;border-radius:999px;font-size:.85rem}\nnav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}nav a{background:#fff;color:var(--blue);padding:8px 13px;border-radius:10px;text-decoration:none;font-weight:650;border:1px solid var(--line)}\nmain{padding:10px 0 45px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 5px 18px #1b37600a}\nh2{margin-top:0;font-size:1.45rem}h3{margin-bottom:5px}.muted{color:var(--muted)}.formula{padding:13px 16px;background:#edf4ff;border-left:4px solid var(--blue);border-radius:9px;font-size:1.25rem;font-weight:700;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.panel{padding:15px;background:#f8faff;border:1px solid var(--line);border-radius:13px}\nlabel{display:block;font-weight:650;margin:10px 0 4px}input[type=range]{width:100%;accent-color:var(--blue)}input[type=number],select{width:100%;padding:9px;border:1px solid #bac8da;border-radius:8px;font:inherit;background:white}\nbutton{border:0;border-radius:9px;padding:9px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}button.secondary{background:#e8eef8;color:#1b3153}button:hover{filter:brightness(.96)}\ncanvas{display:block;width:100%;height:260px;border:1px solid var(--line);border-radius:12px;background:#fff}\n.readout{font-size:1.08rem;font-weight:700;color:#173e8f}.mini{font-size:.9rem;color:var(--muted)}\n.circuit{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;min-height:150px;background:#f8faff;border-radius:12px;border:1px solid var(--line);padding:15px}\n.source{border:2px solid var(--blue);border-radius:50%;width:62px;height:62px;display:grid;place-items:center;font-weight:800;color:var(--blue);background:white}\n.wire{height:3px;width:35px;background:#62748b}.capacitor{display:flex;align-items:center;gap:7px;height:62px}.plate{width:5px;height:54px;background:var(--teal);border-radius:3px}.meter{border:2px solid #64748b;border-radius:50%;width:58px;height:58px;display:grid;place-items:center;background:white;font-size:.85rem}\ntable{border-collapse:collapse;width:100%;margin-top:12px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{background:#edf4ff}\n.quiz-q{padding:12px 0;border-bottom:1px solid var(--line)}.quiz-q label{font-weight:400;display:flex;gap:8px;align-items:flex-start}.result{font-weight:750;margin-top:12px}\nfooter{text-align:center;padding:24px;color:var(--muted)}\n@media(max-width:600px){.card{padding:16px}canvas{height:220px}.formula{font-size:1.1rem}}\n<\/style>\n<\/head>\n<body>\n<header><div class=\"wrap\">\n<span class=\"tag\">11-sinf fizika • Interaktiv dars<\/span>\n<h1>O‘zgaruvchan tok zanjiridagi kondensator<\/h1>\n<p>Nazariy ma’lumotlar, animatsiyalar, formulalar, interaktiv grafiklar, virtual tajriba va bilimni tekshirish testi.<\/p>\n<\/div><\/header>\n<main class=\"wrap\">\n<nav>\n<a href=\"#reja1\">1. Kondensator<\/a><a href=\"#reja2\">2. Faza munosabati<\/a><a href=\"#reja3\">3. Sig‘im qarshiligi<\/a><a href=\"#lab\">Virtual laboratoriya<\/a><a href=\"#test\">Test<\/a>\n<\/nav>\n\n<section class=\"card\" id=\"reja1\">\n<h2>1. O‘zgaruvchan tok zanjirida kondensator va uning fizik xususiyatlari<\/h2>\n<p>Kondensator — elektr zaryadi va elektr maydon energiyasini to‘plashga xizmat qiluvchi qurilma. U odatda dielektrik bilan ajratilgan ikkita o‘tkazgich plastinadan tashkil topadi. O‘zgaruvchan kuchlanish ulanganda kondensator davriy ravishda zaryadlanib va razryadlanib turadi.<\/p>\n<div class=\"formula\">q = C · U<\/div>\n<p>Bu yerda <b>q<\/b> — zaryad (kulon), <b>C<\/b> — sig‘im (farad), <b>U<\/b> — kuchlanish (volt). Ideal kondensator dielektrigi orqali zaryadlar uzluksiz o‘tmaydi, biroq tashqi zanjirda o‘zgaruvchan tok oqadi.<\/p>\n<div class=\"grid\">\n<div class=\"panel\">\n<h3>Plastinalar animatsiyasi<\/h3>\n<p class=\"mini\">Kuchlanish va chastotani o‘zgartirib, zaryadlar hamda elektr maydon yo‘nalishi almashishini kuzating.<\/p>\n<label for=\"v1\">Kuchlanish amplitudasi: <span id=\"v1out\">10<\/span> V<\/label><input id=\"v1\" type=\"range\" min=\"1\" max=\"20\" value=\"10\">\n<label for=\"f1\">Chastota: <span id=\"f1out\">50<\/span> Hz<\/label><input id=\"f1\" type=\"range\" min=\"10\" max=\"1000\" step=\"10\" value=\"50\">\n<div class=\"circuit\"><div class=\"source\">AC<\/div><div class=\"wire\"><\/div><div class=\"capacitor\"><div class=\"plate\" id=\"p1\"><\/div><span id=\"charge1\">+ + +<\/span><div class=\"plate\" id=\"p2\"><\/div><\/div><\/div>\n<p class=\"readout\" id=\"qread\">Zaryad: 100 μC (maksimal)<\/p>\n<p class=\"mini\" id=\"fieldText\">Elektr maydon yo‘nalishi davriy almashadi.<\/p>\n<\/div>\n<div class=\"panel\">\n<h3>Asosiy tushunchalar<\/h3>\n<ul><li>Sig‘im kondensator geometriyasi va dielektrikka bog‘liq.<\/li><li>Kuchlanish ortsa, zaryad ham ortadi: q = CU.<\/li><li>O‘zgaruvchan tokda plastinalardagi zaryad miqdori va ishorasi davriy o‘zgaradi.<\/li><\/ul>\n<p><b>Hayotiy misol:<\/b> kondensatorlar radioelektronika, filtrlar, signal zanjirlari va energiyani qisqa muddat saqlash qurilmalarida ishlatiladi.<\/p>\n<\/div><\/div>\n<\/section>\n\n<section class=\"card\" id=\"reja2\">\n<h2>2. Kondensatorli zanjirda tok kuchi, kuchlanish va ularning fazaviy munosabati<\/h2>\n<p>Ideal kondensatorli o‘zgaruvchan tok zanjirida tok kuchi kuchlanishdan faza bo‘yicha <b>90° (π/2 radian) oldinda<\/b> bo‘ladi. Tok kuchi kuchlanishning vaqt bo‘yicha o‘zgarish tezligiga bog‘liq.<\/p>\n<div class=\"formula\">u = Uₘ sin(ωt) &nbsp;&nbsp; i = Iₘ sin(ωt + π/2)<\/div>\n<p class=\"muted\">Siklik chastota: ω = 2πf. Tok kuchi kuchlanish eng tez o‘zgarayotgan paytda modul jihatdan katta, kuchlanish maksimum yoki minimumga yetgan paytda esa nol bo‘ladi.<\/p>\n<div class=\"grid\">\n<div class=\"panel\"><h3>Sinusoidal grafiklar<\/h3><canvas id=\"phaseCanvas\" width=\"800\" height=\"300\" aria-label=\"Tok va kuchlanishning fazaviy grafigi\"><\/canvas><div class=\"mini\">Ko‘k — kuchlanish u(t), qizil — tok i(t). Tok grafigi chorak davr oldinda.<\/div><\/div>\n<div class=\"panel\">\n<h3>Grafik boshqaruvi<\/h3>\n<label for=\"freq2\">Chastota: <span id=\"freq2out\">50<\/span> Hz<\/label><input id=\"freq2\" type=\"range\" min=\"10\" max=\"100\" value=\"50\">\n<label for=\"amp2\">Kuchlanish amplitudasi: <span id=\"amp2out\">10<\/span> V<\/label><input id=\"amp2\" type=\"range\" min=\"1\" max=\"20\" value=\"10\">\n<div><button id=\"playBtn\">▶ Boshlash<\/button><button class=\"secondary\" id=\"pauseBtn\">Ⅱ Pauza<\/button><button class=\"secondary\" id=\"resetBtn\">↻ Qayta boshlash<\/button><\/div>\n<p class=\"readout\" id=\"phaseRead\">Fazalar farqi: 90°<\/p><p id=\"pointRead\" class=\"mini\">Vaqt nuqtasini tanlash uchun grafik ustiga bosing.<\/p>\n<\/div><\/div>\n<\/section>\n\n<section class=\"card\" id=\"reja3\">\n<h2>3. Kondensatorning sig‘im qarshiligi va uni hisoblash formulasi<\/h2>\n<p>Kondensatorning o‘zgaruvchan tokka ko‘rsatadigan qarshiligi <b>sig‘im qarshiligi<\/b> deyiladi. U chastota va sig‘im ortishi bilan kamayadi.<\/p>\n<div class=\"formula\">X<sub>C<\/sub> = 1/(ωC) = 1/(2πfC)<\/div>\n<div class=\"formula\">I = U/X<sub>C<\/sub><\/div>\n<p>Bu yerda X<sub>C<\/sub> — sig‘im qarshiligi (Ω), f — chastota (Hz), C — sig‘im (F), I va U — effektiv tok hamda kuchlanish qiymatlari.<\/p>\n<div class=\"grid\">\n<div class=\"panel\">\n<h3>Sig‘im qarshiligini sinash<\/h3>\n<label for=\"cap3\">Sig‘im: <span id=\"cap3out\">10<\/span> μF<\/label><input id=\"cap3\" type=\"range\" min=\"1\" max=\"100\" value=\"10\">\n<label for=\"freq3\">Chastota: <span id=\"freq3out\">50<\/span> Hz<\/label><input id=\"freq3\" type=\"range\" min=\"10\" max=\"1000\" step=\"10\" value=\"50\">\n<label for=\"volt3\">Kuchlanish (effektiv): <span id=\"volt3out\">10<\/span> V<\/label><input id=\"volt3\" type=\"range\" min=\"1\" max=\"20\" value=\"10\">\n<div class=\"formula\" id=\"xcResult\">X꜀ = 318.3 Ω<\/div><p class=\"readout\" id=\"iResult\">I = 0.0314 A (31.4 mA)<\/p>\n<\/div>\n<div class=\"panel\"><h3>Chastota va sig‘im grafigi<\/h3
